<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROJELERİM — Derin Record</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="branch.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="glass.css?v=2">
<style>
  .proj-group{margin:30px 0}
  .proj-group > h2{font-size:13px;letter-spacing:.16em;opacity:.65;margin:0 0 14px}
  .proj-empty{opacity:.45;font-size:13px;padding:14px 0}

  .proj-card{position:relative;margin-bottom:18px;padding:26px 28px;border-radius:28px;
    background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
  .proj-card h3{margin:0 0 4px;font-size:18px}
  .proj-card .meta{font-size:12px;opacity:.6;margin:0 0 20px}

  /* Adımlı ilerleme çubuğu — küçültülmüş, sarı kutu içinde (kaset sarısıyla aynı ton) */
  .stage-bar{display:inline-block;min-width:100%;box-sizing:border-box;margin:0 0 10px}
  .stage-row{display:flex;align-items:flex-start;margin:0}
  .stage-step{flex:1;position:relative;text-align:center;font-size:9px;font-weight:800;letter-spacing:.02em;
    line-height:1.15;color:#fff;opacity:.55;transition:opacity .3s}
  .stage-step.done,.stage-step.now{opacity:1}
  .stage-dot{width:9px;height:9px;border-radius:50%;margin:0 auto 5px;position:relative;
    background:rgba(139,61,255,.2);border:1.5px solid rgba(139,61,255,.4);transition:.35s}
  .stage-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(168,85,247,.6),transparent 70%);opacity:0;transition:opacity .35s}
  .stage-step.done .stage-dot{background:#a855f7;border-color:#a855f7}
  .stage-step.now .stage-dot{background:#a855f7;border-color:#a855f7;
    box-shadow:0 0 6px rgba(168,85,247,.85);animation:recBlink 1.3s ease-in-out infinite}
  .stage-step.now .stage-dot::after{opacity:1}
  .stage-step:not(.done):not(.now) .stage-dot{animation:recBlinkDim 2.6s ease-in-out infinite}
  @keyframes recBlink{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes recBlinkDim{0%,100%{opacity:1}50%{opacity:.55}}
  .stage-step::before{content:"";position:absolute;top:4.5px;left:-50%;width:100%;height:1px;
    background:rgba(255,255,255,.2)}
  .stage-step:first-child::before{display:none}
  .stage-step.done::before,.stage-step.now::before{background:#a855f7}

  /* Kaset kartı — ana sayfadaki "DEMOLAR" bölümüyle birebir aynı görsel dil */
  .proj-tracks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:16px;align-items:start;margin-bottom:18px}
  .proj-cassette-card{min-width:0;display:block;position:relative;padding:18px 12px 14px;
    color:#0b0b0d;background:#d4c24e;box-shadow:7px 7px 0 rgba(8,8,8,.45);
    transition:transform .3s ease,box-shadow .3s ease;margin-bottom:34px}
  .proj-tracks-grid .proj-cassette-card{margin-bottom:0}
  .proj-cassette-card:hover{z-index:2;transform:translateY(-26px) rotate(-2deg) scale(1.09);
    box-shadow:15px 20px 0 rgba(8,8,8,.38)}
  .proj-tracks-grid .proj-cassette-card:hover{transform:translateY(-10px) scale(1.05)}
  .proj-cassette-card.acrobatik{background:#f1ece1}
  .proj-cassette-card.artistik{background:#fe4b45}
  .proj-cassette-card.ritmik{background:#ab6ee7}
  .proj-cassette-card.trambolin{background:#f4f126}
  .proj-cassette-card .card-number{font-size:10px;font-weight:900;letter-spacing:1px}
  .proj-cassette-card .demo-cassette-image{display:block;width:100%;aspect-ratio:1.55;
    object-fit:contain;margin:16px 0;filter:drop-shadow(0 5px 4px rgba(0,0,0,.3));
    transition:transform .3s ease}
  .proj-cassette-card:hover .demo-cassette-image{transform:rotate(-2deg) scale(1.04)}
  .proj-cassette-card .card-meta{border-top:2px solid #0b0b0d;padding-top:9px;margin-bottom:14px;
    display:flex;flex-direction:column;gap:5px;font-size:10px;letter-spacing:.5px}
  .proj-cassette-card .card-meta strong{font-size:14px;letter-spacing:-.5px;font-weight:800}
  .proj-cassette-card .card-meta span{font-weight:800}
  .proj-cassette-card .card-meta a{color:#0b0b0d}
  .proj-empty-track{opacity:.82}.proj-empty-track .meta{margin:0}
  .proj-play{padding:12px 20px;border-radius:15px;border:1px solid rgba(11,11,13,.4);
    background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.65));
    color:#131313;font:inherit;font-weight:600;cursor:pointer}
  .proj-delete-track{width:42px;height:42px;border-radius:50%;border:1px solid rgba(11,11,13,.24);
    background:rgba(11,11,13,.06);color:inherit;font-size:22px;cursor:pointer}

  /* Kaset kartı açık zeminli olduğu için içindeki kontrolleri koyu tonda göster */
  .proj-cassette-card .proj-actions select,.proj-cassette-card .proj-actions input[type=file],
  .proj-cassette-card .proj-actions input:not([type=file]){
    border-color:rgba(11,11,13,.3);background:rgba(11,11,13,.08);color:#0b0b0d}
  .proj-cassette-card .proj-actions button{border-color:rgba(11,11,13,.3);background:rgba(11,11,13,.08);color:#0b0b0d}
  .proj-cassette-card .proj-actions button:hover{background:rgba(11,11,13,.16)}
  .proj-cassette-card .proj-actions span{color:#0b0b0d}
  .proj-cassette-card .fb-box{border-top-color:rgba(11,11,13,.15)}
  .proj-cassette-card .fb-list li{border-bottom-color:rgba(11,11,13,.1)}
  .proj-cassette-card .fb-box textarea{border-color:rgba(11,11,13,.3);background:rgba(11,11,13,.08);color:#0b0b0d}

  .proj-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .proj-actions select,.proj-actions input[type=file]{padding:11px 14px;border-radius:14px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;font:inherit}
  .proj-actions button{padding:11px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07);color:inherit;font:inherit;font-size:12px;cursor:pointer}
  .proj-actions .proj-add-track{padding:11px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07);font-size:12px;cursor:pointer}
  .proj-actions button:hover{background:rgba(255,255,255,.15)}

  .fb-box{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
  .fb-list{list-style:none;margin:0 0 12px;padding:0}
  .fb-list li{padding:9px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.07)}
  .fb-list li small{display:block;opacity:.5;font-size:11px;margin-top:3px}
  .fb-box textarea{width:100%;min-height:70px;padding:12px 14px;border-radius:14px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;font:inherit}

  /* Parça detayı — dalga formu üzerinde nokta işaretleme */
  .track-detail{position:relative;margin-bottom:18px;padding:26px 28px 30px;border-radius:28px;
    background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
  .td-back{margin-bottom:18px;padding:9px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07);color:inherit;font:inherit;font-size:12px;letter-spacing:.05em;
    font-weight:700;cursor:pointer}
  .td-back:hover{background:rgba(255,255,255,.15)}
  .td-head{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
  .td-cassette{width:150px;max-width:34vw;aspect-ratio:1.55;object-fit:contain;flex:0 0 auto;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
  .td-head-info{flex:1 1 220px;min-width:180px}
  .td-eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:.16em;font-weight:800;color:#d4c24e}
  .td-title{margin:0 0 8px;font-size:26px;letter-spacing:-.4px}
  .td-sub{margin:0;font-size:13px;opacity:.62}
  .td-player{display:flex;align-items:center;gap:12px;flex:1 1 240px;min-width:220px}
  .td-play{width:46px;height:46px;flex:0 0 auto;border-radius:50%;border:none;background:#d4c24e;
    color:#0b0b0d;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .td-seek{flex:1 1 auto;accent-color:#d4c24e}
  .td-time{font-size:12px;opacity:.65;white-space:nowrap}
  .td-divider{border:none;border-top:1px solid rgba(255,255,255,.14);margin:26px 0}

  .td-shape-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .td-shape-title{margin:0;font-size:22px;letter-spacing:-.3px}
  .td-badge{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid rgba(212,194,78,.5);
    background:rgba(212,194,78,.14);color:#e9dc94;font-size:10px;font-weight:800;letter-spacing:.08em;
    white-space:nowrap}
  .td-desc{margin:12px 0 20px;font-size:13px;line-height:1.6;opacity:.65;max-width:640px}

  .td-wave-wrap{position:relative;padding:16px 10px 46px;border-radius:18px;background:rgba(0,0,0,.32);
    border:1px solid rgba(255,255,255,.1)}
  .td-wave-canvas{width:100%;height:84px;display:block;cursor:pointer}
  .td-marks{position:absolute;left:10px;right:10px;top:16px;bottom:8px;pointer-events:none}
  .td-mark{position:absolute;top:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;cursor:grab;pointer-events:auto;z-index:1}
  .td-mark.active{z-index:2}
  .td-mark-line{width:2px;flex:1 1 auto;min-height:8px;background:#d4c24e;opacity:.9;display:block;
    box-shadow:0 0 4px rgba(0,0,0,.6)}
  .td-mark.saved .td-mark-line{background:#106b44}
  .td-mark.active .td-mark-line{background:#fe4b6a;opacity:1;box-shadow:0 0 6px rgba(254,75,105,.8)}
  .td-mark-badge{margin-top:2px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:10px;font-weight:800;border:2px solid #d4c24e;background:#141416;
    color:#e9dc94;box-shadow:0 1px 4px rgba(0,0,0,.5);flex:0 0 auto}
  .td-mark.saved .td-mark-badge{background:#106b44;border-color:#106b44;color:#fff}
  .td-mark.active .td-mark-badge{transform:scale(1.25);background:#fe4b6a;border-color:#fe4b6a;color:#fff}

  .td-legend{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:14px;
    font-size:11px;opacity:.65}
  .td-legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid #d4c24e;
    background:transparent;vertical-align:middle}
  .td-legend-dot.saved{background:#106b44;border-color:#106b44}

  .td-addrow{margin-top:22px}
  .td-addrow label{display:block;font-size:12px;opacity:.7;margin-bottom:8px}
  .td-addrow label strong{color:#d4c24e;font-weight:800}
  .td-addseek{width:100%;accent-color:#d4c24e}
  .td-addbtn-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
  .td-addbtn{padding:12px 20px;border-radius:14px;border:1px solid rgba(212,194,78,.5);
    background:rgba(212,194,78,.16);color:#e9dc94;font:inherit;font-size:12px;font-weight:800;
    letter-spacing:.04em;cursor:pointer}
  .td-addbtn:hover{background:rgba(212,194,78,.26)}
  .td-addhint{font-size:11px;opacity:.5}

  .td-points-list{margin-top:22px;display:flex;flex-direction:column;gap:14px}
  .td-point{padding:16px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04)}
  .td-point.saved{border-color:rgba(16,107,68,.4);background:rgba(16,107,68,.08)}
  .td-point-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .td-point-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;border:2px solid #d4c24e;color:#e9dc94}
  .td-point.saved .td-point-badge{background:#106b44;border-color:#106b44;color:#fff}
  .td-point-time{font-size:12px;font-weight:700;opacity:.75}
  .td-point-del{margin-left:auto;padding:6px 12px;border-radius:10px;border:1px solid rgba(254,75,105,.4);
    background:rgba(254,75,105,.12);color:#ffb4c0;font:inherit;font-size:11px;cursor:pointer}
  .td-point-note{width:100%;min-height:56px;padding:10px 12px;border-radius:12px;
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:inherit;font:inherit;
    font-size:13px;margin-bottom:10px}
  .td-point-note:disabled{opacity:.75}
  .td-point-voice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .td-point-voice audio{height:32px;max-width:220px}
  .td-point-rec,.td-point-voicedel{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:11px;cursor:pointer}
  .td-point-rec.is-rec{border-color:rgba(254,75,105,.5);background:rgba(254,75,105,.16);color:#ffb4c0}
  .td-point-save{padding:10px 18px;border-radius:12px;border:1px solid rgba(24,195,125,.5);
    background:rgba(24,195,125,.16);color:#6ee7b0;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
  .td-point-save:disabled{opacity:.6;cursor:default}
  .td-empty{opacity:.5;font-size:13px;padding:10px 0}

  /* Parça detayı — üst araçlar (indir / varyasyon yükle / sil) ve hızlı not */
  .td-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
  .td-tool-link,.td-tool-btn,.td-tool-upload,.td-tool-del{padding:9px 16px;border-radius:12px;font:inherit;
    font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07);color:inherit;display:inline-flex;align-items:center;gap:6px;
    text-decoration:none}
  .td-tool-link:hover,.td-tool-btn:hover,.td-tool-upload:hover{background:rgba(255,255,255,.15)}
  .td-tool-del{border-color:rgba(254,75,105,.4);background:rgba(254,75,105,.12);color:#ffb4c0}
  .td-tool-del:hover{background:rgba(254,75,105,.2)}
  .td-quicknote{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .td-quicknote input{flex:1 1 240px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:13px}
  .td-quicknote button{padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07);color:inherit;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .td-quicknote button:hover{background:rgba(255,255,255,.15)}

  /* Yeni proje klasörü — yuvarlak, parlayan artı butonu ve açılır panel */
  .proj-fab{position:fixed;right:26px;bottom:26px;width:62px;height:62px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(34,84,84,.95),rgba(9,20,22,.97));
    border:1px solid rgba(255,255,255,.1);color:#fff;font-size:28px;font-weight:300;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:40;
    box-shadow:0 0 28px rgba(30,110,110,.55),0 10px 28px rgba(0,0,0,.5);
    transition:transform .25s ease,box-shadow .25s ease}
  .proj-fab:hover{transform:scale(1.08);box-shadow:0 0 38px rgba(30,130,130,.7),0 12px 32px rgba(0,0,0,.55)}
  .proj-newfolder-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .proj-newfolder-panel{width:100%;max-width:420px;padding:30px 28px;border-radius:26px;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
  .proj-newfolder-panel h3{margin:0 0 6px;font-size:20px}
  .proj-newfolder-panel p{margin:0 0 20px;font-size:12px;opacity:.6}
  .proj-newfolder-panel input[type=text]{width:100%;box-sizing:border-box;padding:13px 16px;border-radius:14px;
    margin-bottom:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;
    font:inherit;font-size:14px}
  .proj-newfolder-panel input[type=file]{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:14px;
    margin-bottom:20px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;
    font:inherit;font-size:12px}
  .proj-newfolder-error{margin:0 0 10px;font-size:12.5px;line-height:1.55;color:#ff9db0}
  .proj-newfolder-error:empty{display:none}
  .proj-newfolder-note{margin:0 0 10px;font-size:12px;line-height:1.5;opacity:.62}
  .proj-newfolder-note:empty{display:none}
  .proj-newfolder-hint{margin:-14px 0 16px;font-size:11px;line-height:1.5;opacity:.5}
  .proj-newfolder-actions{display:flex;justify-content:flex-end;gap:12px;align-items:center}
  .proj-newfolder-cancel{padding:11px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:12px;cursor:pointer}
  .proj-newfolder-cancel:hover{background:rgba(255,255,255,.14)}
  .proj-newfolder-confirm{width:52px;height:52px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,rgba(130,30,60,.92),rgba(60,10,30,.96));
    box-shadow:0 0 24px rgba(254,75,105,.55),0 8px 20px rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.1);color:#fff;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:box-shadow .2s ease}
  .proj-newfolder-confirm:hover{box-shadow:0 0 32px rgba(254,75,105,.75),0 10px 24px rgba(0,0,0,.45)}
  .proj-newfolder-confirm:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<div class="noise"></div>
<header class="header">
  <a class="home" href="index.html"><span>←</span> ANA SAYFA</a>
  <div class="wordmark">DERİN<br>RECORD<b>•</b></div>
</header>
<main class="admin-main">
  <p class="eyebrow">DERİN RECORD</p>
  <h1>PROJELERİM<br><span>VE AŞAMALAR.</span></h1>
  <p id="s" role="status">Hesap kontrol ediliyor…</p>
  <button id="refresh" type="button" hidden>Yenile</button>
  <section id="list"></section>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1"></script>
<script src="auth.js?v=20260926"></script>
<script src="audio-file-types.js?v=2"></script>
<script src="project-track-controls.js?v=1"></script>
<script src="sortable-touch.js?v=1"></script>
<script src="projects.js?v=20260926c"></script>
</body>
</html>
