<!doctype html>
<html lang="tr" data-dil-otomatik data-baslik-en="My Projects — Derin Record">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROJELERİM — Derin Record</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=3"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="stylesheet" href="branch.css">
<link rel="stylesheet" href="auth.css?v=20261027a">
<link rel="stylesheet" href="glass.css?v=2">
<style>
  /* ===== PROJE ODASI — üst segment görünüm (zine dili: mürekkep, krem, altın) ===== */
  :root{--pj-ink:#0b0b0d;--pj-yuzey:#131316;--pj-yuzey2:#18181c;--pj-cizgi:rgba(244,241,233,.1);
    --pj-cizgi2:rgba(244,241,233,.18);--pj-krem:#f4f1e9;--pj-soluk:#a8a5a0;--pj-altin:#d8bb2c;
    --pj-altin2:#e8d15a;--pj-pembe:#cb2468;--pj-yesil:#5fcf8f;--pj-serif:Georgia,"Times New Roman",serif}
  body{background:var(--pj-ink)}
  .admin-main{max-width:1080px;margin:0 auto;padding:0 6vw 120px;box-sizing:border-box}

  .pj-hero{position:relative;padding:64px 0 40px;border-bottom:1px solid var(--pj-cizgi);overflow:hidden}
  .pj-hero::after{content:"";position:absolute;width:360px;height:360px;right:-150px;top:-170px;border-radius:50%;
    background-image:radial-gradient(circle,var(--pj-altin) 1.6px,transparent 2.4px);background-size:16px 16px;
    opacity:.35;pointer-events:none}
  .pj-hero .eyebrow{margin:0 0 22px;color:var(--pj-altin);font-size:11px;font-weight:900;letter-spacing:.24em}
  .pj-hero h1{margin:0;font-size:clamp(46px,8vw,96px);line-height:.86;letter-spacing:-.055em;font-weight:900}
  .pj-hero h1 em{font-family:var(--pj-serif);font-style:italic;font-weight:400;letter-spacing:-.03em;color:var(--pj-altin2)}
  .pj-lead{max-width:520px;margin:22px 0 0;color:#c7c3be;font-size:15px;line-height:1.6}
  .pj-ozet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:38px 0 0;border:1px solid var(--pj-cizgi);
    border-radius:18px;overflow:hidden;background:rgba(244,241,233,.02)}
  .pj-ozet[hidden]{display:none}
  .pj-ozet div{padding:18px 20px;border-left:1px solid var(--pj-cizgi)}
  .pj-ozet div:first-child{border-left:0}
  .pj-ozet b{display:block;font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1}
  .pj-ozet span{display:block;margin-top:8px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--pj-soluk)}
  .pj-ozet .vurgu b{color:var(--pj-altin)}
  .pj-arac{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}
  .pj-arac #s{margin:0 auto 0 0;font-size:12px;color:var(--pj-soluk);letter-spacing:.02em}
  .pj-arac #s:empty{display:none}
  #refresh,#foldall{margin:0;padding:10px 16px;border-radius:999px;border:1px solid var(--pj-cizgi2);background:transparent;
    color:var(--pj-krem);font:inherit;font-size:10px;font-weight:800;letter-spacing:.14em;cursor:pointer;
    transition:background .2s,border-color .2s}
  #refresh:hover,#foldall:hover{background:rgba(244,241,233,.08);border-color:rgba(244,241,233,.32)}
  #refresh[hidden],#foldall[hidden]{display:none}

  .proj-group{margin:52px 0 0}
  .proj-group > h2{display:flex;align-items:center;gap:14px;margin:0 0 18px;font-size:11px;font-weight:900;
    letter-spacing:.22em;color:var(--pj-soluk)}
  .proj-group > h2::after{content:"";flex:1;height:1px;background:var(--pj-cizgi)}
  .proj-group > h2 i{font-style:normal;color:var(--pj-altin)}
  .proj-empty{margin:0;padding:22px;border:1px dashed var(--pj-cizgi2);border-radius:16px;color:var(--pj-soluk);font-size:13px}

  .proj-card{position:relative;margin-bottom:16px;padding:26px 28px;border-radius:22px;background:var(--pj-yuzey);
    border:1px solid var(--pj-cizgi);box-shadow:0 1px 0 rgba(244,241,233,.05) inset,0 24px 60px rgba(0,0,0,.35);
    transition:border-color .25s}
  .proj-card:hover{border-color:var(--pj-cizgi2)}
  .proj-card::before{content:"";position:absolute;left:0;top:26px;bottom:26px;width:3px;border-radius:0 3px 3px 0;
    background:var(--pj-durum,var(--pj-altin))}
  .proj-card[data-durum="bekliyor"]{--pj-durum:var(--pj-soluk)}
  .proj-card[data-durum="teslim"]{--pj-durum:var(--pj-yesil)}
  .proj-card h3{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.15}

  .proj-head{display:flex;align-items:flex-start;gap:14px;cursor:pointer;user-select:none;margin-bottom:24px}
  .proj-no{flex:0 0 auto;padding-top:5px;font-family:var(--pj-serif);font-style:italic;font-size:15px;color:var(--pj-altin);min-width:28px}
  .proj-head-main{flex:1 1 auto;min-width:0}
  .proj-kicker{margin:0 0 6px;font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--pj-soluk);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proj-head .meta{margin:8px 0 0;font-size:12px;color:var(--pj-soluk);display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .proj-head:focus-visible{outline:2px solid var(--pj-altin);outline-offset:6px;border-radius:12px}
  .proj-head:hover .proj-fold-label{background:rgba(244,241,233,.08)}
  .proj-fold-label{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--pj-cizgi2);
    font-size:9px;font-weight:900;letter-spacing:.14em;white-space:nowrap;color:var(--pj-soluk)}
  .proj-fold-arrow{flex:0 0 auto;width:12px;padding-top:6px;text-align:center;font-size:12px;color:var(--pj-soluk)}
  .proj-stage-chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid rgba(216,187,44,.45);
    background:rgba(216,187,44,.1);color:var(--pj-altin2);font-size:9px;font-weight:900;letter-spacing:.12em;white-space:nowrap}
  .proj-card:not(.katli) .proj-stage-chip{display:none}
  .proj-fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s ease}
  .proj-card.katli .proj-fold{grid-template-rows:0fr}
  .proj-card.katli .proj-head{margin-bottom:0}
  .proj-fold-inner{overflow:hidden;min-height:0}
  @media(prefers-reduced-motion:reduce){.proj-fold{transition:none}}

  /* Aşama zaman çizgisi */
  .stage-bar{margin:0 0 26px;padding:18px 20px 16px;border-radius:16px;background:var(--pj-yuzey2);border:1px solid var(--pj-cizgi)}
  .stage-ust{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
  .stage-ust span{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--pj-soluk)}
  .stage-ust b{font-family:var(--pj-serif);font-style:italic;font-weight:400;font-size:18px;color:var(--pj-altin2)}
  .stage-row{display:flex;align-items:flex-start}
  .stage-step{flex:1;position:relative;text-align:center;font-size:9px;font-weight:800;letter-spacing:.08em;
    line-height:1.25;color:var(--pj-soluk);padding:0 2px}
  .stage-step.done{color:var(--pj-krem)}
  .stage-step.now{color:var(--pj-altin2)}
  .stage-dot{width:11px;height:11px;border-radius:50%;margin:0 auto 9px;position:relative;z-index:1;box-sizing:border-box;
    background:var(--pj-yuzey2);border:1.5px solid rgba(244,241,233,.28)}
  .stage-step.done .stage-dot{background:var(--pj-altin);border-color:var(--pj-altin)}
  .stage-step.now .stage-dot{background:var(--pj-altin2);border-color:var(--pj-altin2);box-shadow:0 0 0 5px rgba(216,187,44,.16)}
  .stage-step.now .stage-dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(232,209,90,.55);
    animation:pjNabiz 2.2s ease-out infinite}
  @keyframes pjNabiz{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.6);opacity:0}}
  @media(prefers-reduced-motion:reduce){.stage-step.now .stage-dot::after{animation:none}}
  .stage-step::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:1px;background:rgba(244,241,233,.16)}
  .stage-step:first-child::before{display:none}
  .stage-step.done::before,.stage-step.now::before{background:var(--pj-altin)}
  .pj-bekleme{margin:0 0 26px;padding:18px 20px;border-radius:16px;border:1px dashed var(--pj-cizgi2);
    color:#c7c3be;font-size:13px;line-height:1.6}
  .pj-bekleme strong{display:block;margin-bottom:4px;color:var(--pj-krem);font-size:11px;letter-spacing:.16em}

  /* Bölüm başlıkları (parçalar / notlar) */
  .pj-baslik{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px;
    font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--pj-soluk)}
  .pj-baslik i{font-style:normal;color:var(--pj-altin)}

  /* Parça listesi — stüdyo kayıt defteri gibi satırlar */
  .proj-tracks{display:flex;flex-direction:column;margin:0 0 26px;border-top:1px solid var(--pj-cizgi)}
  .proj-track{display:grid;grid-template-columns:30px 62px 1fr auto auto 18px;align-items:center;gap:16px;width:100%;
    padding:14px 8px;border:0;border-bottom:1px solid var(--pj-cizgi);background:transparent;color:inherit;
    font:inherit;text-align:left;cursor:pointer;transition:background .2s}
  .proj-track:hover,.proj-track:focus-visible{background:rgba(244,241,233,.04);outline:none}
  .proj-track:focus-visible{box-shadow:inset 0 0 0 2px var(--pj-altin)}
  .pt-no{font-family:var(--pj-serif);font-style:italic;font-size:14px;color:var(--pj-soluk)}
  .pt-kaset{display:block;width:62px;aspect-ratio:1.55;border-radius:6px;padding:4px;box-sizing:border-box;background:#d4c24e}
  .pt-kaset img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
    transition:transform .3s ease}
  .proj-track:hover .pt-kaset img{transform:rotate(-4deg) scale(1.06)}
  .pt-kaset.acrobatik{background:#f1ece1}.pt-kaset.artistik{background:#fe4b45}
  .pt-kaset.ritmik{background:#ab6ee7}.pt-kaset.trambolin{background:#f4f126}
  .pt-ad{min-width:0}
  .pt-ad strong{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt-ad small{display:block;margin-top:4px;font-size:11px;color:var(--pj-soluk)}
  .pt-surum{padding:5px 10px;border-radius:999px;border:1px solid var(--pj-cizgi2);font-size:10px;font-weight:900;letter-spacing:.08em}
  /* İndirme izni parça parça (25 Ekim) */
  .pt-indir{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:4px;vertical-align:2px;border-radius:50%;background:rgba(95,207,143,.16);color:var(--pj-yesil);font-size:11px;font-weight:900}
  .td-dl-izin.aktif{background:rgba(95,207,143,.14);border-color:rgba(95,207,143,.6);color:var(--pj-yesil)}
  .pt-surum.hazir{border-color:rgba(216,187,44,.45);color:var(--pj-altin2)}
  .pt-not{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--pj-altin2)}
  .pt-not:empty{visibility:hidden}
  .pt-not svg{width:13px;height:10px}
  .pt-ok{color:var(--pj-soluk);font-size:15px;transition:transform .2s}
  .proj-track:hover .pt-ok{transform:translateX(3px);color:var(--pj-altin2)}
  .proj-empty-track{padding:20px 8px;border-bottom:1px solid var(--pj-cizgi);color:var(--pj-soluk);font-size:13px}

  /* Yönetim araçları (yalnız yönetici) */
  .proj-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .proj-yonetim{margin:0 0 26px;padding:14px;border-radius:16px;background:rgba(216,187,44,.05);border:1px solid rgba(216,187,44,.18)}
  .proj-yonetim > span{width:100%;margin:0 0 4px 2px;font-size:9px;font-weight:900;letter-spacing:.2em;color:var(--pj-altin)}
  .proj-actions select,.proj-actions button,.proj-actions .proj-add-track{padding:10px 14px;border-radius:12px;
    border:1px solid var(--pj-cizgi2);background:var(--pj-yuzey2);color:var(--pj-krem);font:inherit;font-size:11px;
    font-weight:800;letter-spacing:.06em;cursor:pointer}
  .proj-actions button:hover,.proj-actions .proj-add-track:hover{background:#202026}
  .proj-actions button.aktif{border-color:rgba(95,207,143,.5);background:rgba(95,207,143,.12);color:#9ee8bd}
  .proj-actions button.tehlike{border-color:rgba(203,36,104,.45);color:#ff9cc3;background:transparent}
  .proj-actions button.tehlike:hover{background:rgba(203,36,104,.12)}
  .proj-arsiv{margin:64px 0 0;border:1px dashed var(--pj-cizgi2);border-radius:18px;padding:0 18px}
  .proj-arsiv > summary{display:flex;align-items:center;gap:12px;padding:18px 0;cursor:pointer;list-style:none;font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--pj-soluk)}
  .proj-arsiv > summary::-webkit-details-marker{display:none}
  .proj-arsiv > summary::after{content:"▸";margin-left:auto;font-size:12px}
  .proj-arsiv[open] > summary::after{content:"▾"}
  .proj-arsiv > summary i{font-style:normal;color:var(--pj-altin)}
  .proj-arsiv-liste{list-style:none;margin:0;padding:0 0 10px}
  .proj-arsiv-liste li{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--pj-cizgi)}
  .proj-arsiv-liste li > div{flex:1;min-width:180px}
  .proj-arsiv-liste strong{display:block;font-size:15px}
  .proj-arsiv-liste small{display:block;margin-top:4px;color:var(--pj-soluk);font-size:12px}
  .proj-arsiv-liste .proj-actions{display:flex;gap:8px;flex-wrap:wrap}
  .proj-arsiv-liste li.arsiv-acik{display:block;padding:16px 0 6px}
  .proj-arsiv-liste li.arsiv-acik .proj-card{margin:10px 0 0}
  .arsiv-kapat{padding:10px 14px;border-radius:12px;border:1px solid var(--pj-cizgi2);background:var(--pj-yuzey2);color:var(--pj-krem);font:inherit;font-size:11px;font-weight:800;letter-spacing:.06em;cursor:pointer}

  /* Notlar — sohbet akışı */
  .fb-box{padding-top:4px}
  .fb-list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:12px}
  .fb-list li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;font-size:14px;line-height:1.5}
  .fb-list li.bos{display:block;padding:14px 0;color:var(--pj-soluk);font-size:13px}
  .fb-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;background:var(--pj-yuzey2);border:1px solid var(--pj-cizgi2);color:var(--pj-krem)}
  .fb-av.stu{background:var(--pj-altin);border-color:var(--pj-altin);color:var(--pj-ink)}
  .fb-av{overflow:hidden}
  .fb-av img{width:100%;height:100%;object-fit:cover;display:block}
  .fb-govde{min-width:0;overflow-wrap:anywhere}
  .fb-govde em{font-style:normal;color:var(--pj-altin2);font-size:12px}
  .fb-list li small{display:block;margin-top:3px;color:var(--pj-soluk);font-size:11px}
  .fb-yaz{display:flex;gap:10px;align-items:flex-end}
  .fb-box textarea{flex:1;box-sizing:border-box;min-height:48px;max-height:180px;padding:13px 16px;border-radius:14px;
    border:1px solid var(--pj-cizgi2);background:var(--pj-yuzey2);color:inherit;font:inherit;font-size:14px;resize:vertical}
  .fb-box textarea:focus{outline:none;border-color:rgba(216,187,44,.55)}
  .fb-yaz button{flex:0 0 auto;height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--pj-altin);
    color:var(--pj-ink);font:inherit;font-size:11px;font-weight:900;letter-spacing:.12em;cursor:pointer}
  .fb-yaz button:hover{background:var(--pj-altin2)}
  .fb-yaz button:disabled{opacity:.6;cursor:default}

  @media(max-width:640px){
    .admin-main{padding:0 16px 110px}
    .pj-hero{padding:40px 0 30px}
    .pj-hero::after{width:220px;height:220px;right:-120px;top:-110px;opacity:.22}
    .pj-lead{font-size:14px}
    .pj-ozet{grid-template-columns:repeat(2,minmax(0,1fr))}
    .pj-ozet div:nth-child(3){border-left:0}
    .pj-ozet div:nth-child(n+3){border-top:1px solid var(--pj-cizgi)}
    .pj-ozet div{padding:16px}
    .pj-ozet b{font-size:26px}
    .proj-card{padding:20px 18px;border-radius:18px}
    .proj-card::before{top:20px;bottom:20px}
    .proj-card h3{font-size:20px}
    .proj-no{display:none}
    .proj-fold-label{display:none}
    .stage-bar{padding:16px 12px 14px}
    .stage-step{font-size:8px;letter-spacing:.02em}
    .proj-track{grid-template-columns:48px 1fr auto auto;gap:10px;padding:12px 4px}
    .pt-no,.pt-ok{display:none}
    .pt-kaset{width:48px}
    .fb-yaz button{padding:0 16px}
  }

  /* Parça detayı — dalga formu üzerinde nokta işaretleme */
  .track-detail{position:relative;margin:40px 0 18px;padding:28px 28px 32px;border-radius:22px;
    background:var(--pj-yuzey);border:1px solid var(--pj-cizgi);box-shadow:0 24px 60px rgba(0,0,0,.35)}
  @media(max-width:640px){.track-detail{padding:22px 18px 26px;border-radius:18px}}
  .td-back{margin-bottom:18px;padding:9px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07);color:inherit;font:inherit;font-size:12px;letter-spacing:.05em;
    font-weight:700;cursor:pointer}
  .td-back:hover{background:rgba(255,255,255,.15)}
  .td-head{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
  .td-cassette{width:150px;max-width:34vw;aspect-ratio:1.55;object-fit:contain;flex:0 0 auto;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
  .td-head-info{flex:1 1 220px;min-width:180px}
  .td-eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:.16em;font-weight:800;color:#d4c24e}
  .td-title{margin:0 0 8px;font-size:26px;letter-spacing:-.4px}
  .td-sub{margin:0;font-size:13px;opacity:.62}
  .td-player{display:flex;align-items:center;gap:12px;flex:1 1 240px;min-width:220px}
  .td-play{width:46px;height:46px;flex:0 0 auto;border-radius:50%;border:none;background:#d4c24e;
    color:#0b0b0d;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .td-seek{flex:1 1 auto;accent-color:#d4c24e}
  .td-time{font-size:12px;opacity:.65;white-space:nowrap}
  .td-divider{border:none;border-top:1px solid rgba(255,255,255,.14);margin:26px 0}

  .td-shape-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .td-shape-sol{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .td-shape-sol .td-eyebrow{margin:0}
  .td-bilgi-ac{padding:6px 12px;border-radius:999px;border:1px solid var(--pj-cizgi2);background:transparent;color:var(--pj-soluk);
    font:inherit;font-size:9px;font-weight:900;letter-spacing:.14em;cursor:pointer}
  .td-bilgi-ac:hover,.td-bilgi-ac[aria-expanded="true"]{color:var(--pj-krem);border-color:rgba(244,241,233,.35)}
  .td-bilgi-ac b{font-size:10px;letter-spacing:0;margin-left:2px}
  .td-bilgi-ac:focus-visible{outline:2px solid var(--pj-altin);outline-offset:2px}
  .td-badge{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid rgba(212,194,78,.5);
    background:rgba(212,194,78,.14);color:#e9dc94;font-size:10px;font-weight:800;letter-spacing:.08em;
    white-space:nowrap}
  .td-desc{margin:14px 0 4px;padding:14px 16px;border-radius:14px;background:rgba(244,241,233,.04);border:1px solid var(--pj-cizgi);
    font-size:13px;line-height:1.6;color:#c7c3be;max-width:680px}
  .td-desc[hidden]{display:none}
  .td-desc p{margin:0 0 6px}.td-desc p:last-child{margin:0}

  /* ===== Dalga formu, işaretler ve not klasörleri ===== */
  .td-desc strong{color:var(--pj-altin2);font-weight:800}
