<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Derin Record — Yayın</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(1200px 700px at 20% -10%,#241a10 0%,#0b0b0d 55%),#0b0b0d;
       color:#f4f4f5;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       overflow:hidden}
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none}
  body::before{width:420px;height:420px;background:#c98a4b;top:-120px;left:-90px;animation:drift 18s ease-in-out infinite alternate}
  body::after{width:360px;height:360px;background:#3b6ea5;bottom:-130px;right:-80px;animation:drift 22s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,40px)}}

  .wrap{position:relative;width:min(560px,92vw);text-align:center;padding:38px 30px;border-radius:34px;
        background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
        border:1px solid rgba(255,255,255,.22);
        -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
        box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35),
                   inset 0 -1px 0 rgba(255,255,255,.08)}
  .wrap::after{content:"";position:absolute;inset:0;border-radius:34px;pointer-events:none;
       background:linear-gradient(120deg,rgba(255,255,255,.25),transparent 32%,transparent 68%,rgba(255,255,255,.12));
       mix-blend-mode:overlay}
  .mark{font-size:12px;letter-spacing:.3em;opacity:.6;margin-bottom:22px}
  .cover{width:180px;height:180px;border-radius:26px;object-fit:cover;margin:0 auto 20px;display:none;
         box-shadow:0 20px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
  h1{margin:0 0 6px;font-size:27px;letter-spacing:-.01em}
  .sub{opacity:.62;font-size:14px;margin:0 0 20px}
  .now{margin:18px 0 6px;font-size:19px;font-weight:600;min-height:26px}
  .folder{opacity:.62;font-size:13px;min-height:20px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#18c37d;margin-right:8px;
       box-shadow:0 0 12px #18c37d;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  button{margin-top:24px;padding:15px 34px;border:1px solid rgba(255,255,255,.4);border-radius:20px;
         background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.62));color:#131313;
         font:inherit;font-weight:600;cursor:pointer;
         box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.9)}
  button:active{transform:scale(.97)}
  .state{margin-top:20px;font-size:13px;opacity:.6;min-height:20px}
  .hours{margin-top:14px;font-size:12px;opacity:.45;letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">DERİN RECORD</div>
  <img class="cover" id="cover" alt="">
  <h1 id="brand">Bağlanıyor…</h1>
  <p class="sub" id="branch"></p>
  <div class="now" id="now"></div>
  <div class="folder" id="folder"></div>
  <button id="start" hidden>YAYINI BAŞLAT</button>
  <div class="state" id="state"></div>
  <div class="hours" id="hours"></div>
  <audio id="audio"></audio>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1"></script>
<script src="radio-playlist-queue.js?v=20260922a"></script>
<script src="radyo.js?v=20260922a"></script>
</body>
</html>
