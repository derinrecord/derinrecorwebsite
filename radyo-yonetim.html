<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Derin Record — Yayın</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0b0b0d;color:#f4f4f5;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .wrap{width:min(560px,92vw);text-align:center;padding:36px 28px;border-radius:30px;
        border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035)}
  .mark{font-size:12px;letter-spacing:.3em;opacity:.55;margin-bottom:26px}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.01em}
  .sub{opacity:.6;font-size:14px;margin:0 0 26px}
  .now{margin:22px 0 6px;font-size:19px;font-weight:600;min-height:26px}
  .folder{opacity:.6;font-size:13px;min-height:20px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#18c37d;margin-right:8px;
       animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  button{margin-top:26px;padding:15px 34px;border:0;border-radius:18px;background:#fff;color:#111;
         font:inherit;font-weight:600;cursor:pointer}
  button:active{transform:scale(.97)}
  .state{margin-top:22px;font-size:13px;opacity:.55;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">DERİN RECORD</div>
  <h1 id="brand">Bağlanıyor…</h1>
  <p class="sub" id="branch"></p>
  <div class="now" id="now"></div>
  <div class="folder" id="folder"></div>
  <button id="start" hidden>YAYINI BAŞLAT</button>
  <div class="state" id="state"></div>
  <audio id="audio"></audio>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1"></script>
<script src="radyo.js?v=20260916"></script>
</body>
</html>
