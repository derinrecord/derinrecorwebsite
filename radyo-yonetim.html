<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurumsal Radyo — Derin Record</title>
<link rel="stylesheet" href="branch.css">
  <link rel="stylesheet" href="glass.css?v=3">
<link rel="stylesheet" href="auth.css">
<style>
  .admin-main{position:relative;z-index:1}
  body::before{content:"";position:fixed;width:520px;height:520px;border-radius:50%;
    background:#c98a4b;filter:blur(110px);opacity:.22;top:-180px;left:-140px;pointer-events:none;z-index:0}
  body::after{content:"";position:fixed;width:440px;height:440px;border-radius:50%;
    background:#3b6ea5;filter:blur(110px);opacity:.18;bottom:-180px;right:-120px;pointer-events:none;z-index:0}

  .radio-panel{position:relative;margin:26px 0;padding:24px;border-radius:28px;
    background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3),
               inset 0 -1px 0 rgba(255,255,255,.06)}
  .radio-panel::after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.2),transparent 30%,transparent 70%,rgba(255,255,255,.1));
    mix-blend-mode:overlay}
  .radio-panel>*{position:relative;z-index:1}
  .radio-panel h2{margin:0 0 16px;font-size:15px;letter-spacing:.14em}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px;margin:26px 0}
  .card{position:relative;padding:26px 22px;border-radius:26px;cursor:pointer;text-decoration:none;color:inherit;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
    box-shadow:0 16px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s}
  .card:hover{transform:translateY(-5px);box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.4)}
  .card .ico{width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;font-size:24px;
    background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.06));
    box-shadow:0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(0,0,0,.25)}
  .card h3{margin:0 0 4px;font-size:16px;letter-spacing:.06em}
  .card p{margin:0;font-size:13px;opacity:.6}

  .crumb{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:13px;opacity:.75}
  .crumb a{color:inherit;text-decoration:none;padding:7px 14px;border-radius:13px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
  .crumb a:hover{background:rgba(255,255,255,.14)}

  .radio-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .radio-row input,.radio-row select{flex:1 1 180px;padding:12px 15px;border-radius:16px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;font:inherit;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .radio-row input:focus,.radio-row select:focus{outline:0;border-color:rgba(255,255,255,.45);
    box-shadow:0 0 0 4px rgba(255,255,255,.08)}
  .radio-row input[type=time]{flex:0 0 130px}
  .radio-row button{padding:12px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.4);
    background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.65));color:#131313;
    font:inherit;font-weight:600;cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.9)}
  .radio-row button:active{transform:scale(.97)}

  .drop{flex:1 1 180px;position:relative;min-height:52px;border-radius:16px;cursor:pointer;
    border:1px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);
    display:flex;align-items:center;justify-content:center;transition:.2s}
  .drop:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.5)}
  .drop::before,.drop::after{content:"";position:absolute;background:rgba(255,255,255,.75);border-radius:2px}
  .drop::before{width:18px;height:2px}
  .drop::after{width:2px;height:18px}
  .drop.has-file{border-style:solid;border-color:#18c37d;background:rgba(24,195,125,.12)}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}

  .radio-list{list-style:none;margin:0;padding:0}
  .radio-list li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    padding:12px 0;border-top:1px solid rgba(255,255,255,.1)}
  .radio-list li small{opacity:.6;font-size:12px;word-break:break-all;display:block}
  .radio-list button{padding:8px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:12px;cursor:pointer;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .radio-list button:hover{background:rgba(255,255,255,.14)}
  .radio-list button:disabled{opacity:.3;cursor:default}
  .open-row{cursor:pointer}
  .open-row:hover{background:rgba(255,255,255,.05)}
  .radio-live{padding:4px 12px;border-radius:999px;background:rgba(24,195,125,.9);color:#04231a;
    font-size:11px;font-weight:700;letter-spacing:.08em;box-shadow:0 0 16px rgba(24,195,125,.5)}
  .radio-msg{min-height:20px;font-size:13px;opacity:.85}
  .rec-on{background:linear-gradient(145deg,#ff6b6b,#d63d3d)!important;color:#fff!important;
    border-color:rgba(255,255,255,.3)!important}
  .cover-big{width:120px;height:120px;border-radius:26px;object-fit:cover;
    box-shadow:0 16px 36px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="noise"></div>
<header class="header">
  <a class="home" href="index.html"><span>←</span> SİTEYE DÖN</a>
  <div class="wordmark">DERİN<br>RECORD<b>•</b></div>
</header>
<main class="admin-main">
  <p class="eyebrow">KURUMSAL YAYIN</p>
  <h1>RADYO<br><span>KONTROLÜ.</span></h1>
  <p id="radio-status">Hesap kontrol ediliyor…</p>
  <section id="radio-app" hidden></section>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1"></script>
<script src="auth.js?v=20260914"></script>
<script src="radyo-yonetim.js?v=20260916d"></script>
</body>
</html>
