<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radyo Kontrolü — Derin Record</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- auth.css: giriş penceresi (auth.js) bu dosyanın sınıflarını kullanır. -->
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="radyo-panel.css?v=1">
</head>
<body>

<!-- Yan menü ve sayfa başlığı JavaScript ile çizilir: menüdeki sayılar
     (şube, klasör, marka, talep) canlı veriden gelir. -->
<aside class="rail" id="rail" hidden></aside>

<div class="app">
  <header class="topbar">
    <div class="title">
      <h1 id="page-title">Radyo kontrolü</h1>
      <p id="page-sub">Hesap kontrol ediliyor…</p>
    </div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="search" placeholder="Ara… (şube, marka, parça)" autocomplete="off">
    </label>
    <span class="status-dot bekliyor" id="live-dot"><i></i> <span id="live-text">bağlanıyor</span></span>
  </header>
  <main class="view" id="view"></main>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Detay"></aside>
<div class="modal-wrap" id="modal-wrap" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="player" id="player"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1"></script>
<script src="auth.js?v=20260926"></script>
<script src="audio-file-types.js?v=3"></script>
<script src="radyo-panel-views.js?v=1"></script>
<script src="radyo-yonetim.js?v=20260926c"></script>
<!-- Dokunmatik cihazda basılı tutup sıralamayı etkinleştirir (tr[draggable]). -->
<script src="sortable-touch.js?v=1"></script>
</body>
</html>
