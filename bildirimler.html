<!doctype html><html lang="tr" data-dil-otomatik data-baslik-en="Notifications — Derin Record"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bildirimler — Derin Record</title><meta name="theme-color" content="#0b0b0d"><link rel="icon" href="/favicon.ico?v=3" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=3"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3"><link rel="stylesheet" href="branch.css"><link rel="stylesheet" href="auth.css?v=20261027a"><link rel="stylesheet" href="glass.css?v=2" /><style>
/* Müşteri sunumunun (marka-sunum.css) "zine" dili: gren yok; köşeli bloklar,
   bulanıksız kaymış gölge, kenarlarda pembe nokta tramı, arkada griye çekilmiş
   dağınık kasetler. Renkler: mürekkep, krem, altın, pembe. */
.bild-root{--ink:#0b0b0d;--cream:#f4f1e9;--pink:#cb2468;--gold:#d8bb2c;--gold2:#e8d15a;--green:#3ccf7a;--line:rgba(255,255,255,.14);
  position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(16px,4vw,46px) 72px}
/* Arka plan katmanları sayfanın TAMAMINI kaplar (yalnız ilk ekranı değil):
   uzun listede alt kısım düz kalmasın. */
body:has(.bild-root){position:relative;min-height:100vh;background:var(--ink,#0b0b0d)}
/* Üst şerit: glass.css'in yuvarlak cam bandı yerine düz bant + pembe çizgi. */
body:has(.bild-root) .header{position:relative;z-index:2;border-radius:0;margin:0;width:100%;max-width:none;
  padding:16px clamp(16px,2.2vw,46px);border:0;border-bottom:2px solid #cb2468;background:rgba(12,11,14,.92);box-shadow:none}
body:has(.bild-root) .header .home{border-radius:0}
/* Arka plan: kenarlarda yoğun, ortada seyrek pembe nokta tramı. */
.bild-tram{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.38;
  background-image:radial-gradient(circle,#cb2468 1.4px,transparent 2.1px);background-size:17px 17px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,transparent 34%,#000 88%);
  mask-image:radial-gradient(ellipse at 50% 50%,transparent 34%,#000 88%)}
.bild-arka{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bild-arka img{position:absolute;display:block;filter:grayscale(1) contrast(1.15) brightness(1.9);opacity:.08;mix-blend-mode:screen}
.bild-arka .k1{width:min(480px,46vw);top:6%;left:-10%;transform:rotate(-14deg)}
.bild-arka .k2{width:min(360px,34vw);top:34%;right:-7%;transform:rotate(9deg);opacity:.07}
.bild-arka .k3{width:min(400px,40vw);bottom:-8%;left:30%;transform:rotate(-7deg);opacity:.06}
.bild-eyebrow{margin:0;font-size:11px;font-weight:900;letter-spacing:.28em;color:var(--gold2);opacity:.8}
.bild-root h1{margin:12px 0 14px;font-size:clamp(42px,7vw,84px);line-height:.8;letter-spacing:-.065em;font-weight:900;color:var(--cream)}
.bild-root h1 span{color:var(--pink)}
#bild-status{margin:0;max-width:640px;font-size:15px;line-height:1.6;color:rgba(244,241,233,.78)}
.bild-ozet{display:flex;flex-wrap:wrap;gap:0;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.bild-filtre{appearance:none;border:1px solid rgba(255,255,255,.22);margin-right:-1px;background:transparent;color:var(--cream);
  font:inherit;font-weight:900;font-size:11.5px;letter-spacing:.12em;padding:11px 18px;border-radius:0;cursor:pointer;min-height:44px}
.bild-filtre b{margin-left:6px;color:var(--gold2)}
.bild-filtre.aktif{position:relative;background:var(--gold);border-color:var(--gold);color:var(--ink)}
.bild-filtre.aktif b{color:var(--ink)}
.bild-list{display:flex;flex-direction:column;gap:22px;margin-top:26px}
/* Kart: düz mürekkep blok, sol altın şerit, sağ-alta kaymış sert gölge. */
.bild-card{position:relative;padding:22px 24px 22px 28px;border-radius:0;background:#141317;color:var(--cream);
  border:1px solid rgba(255,255,255,.1);box-shadow:8px 8px 0 var(--pink)}
.bild-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold)}
.bild-card.onayli{box-shadow:8px 8px 0 rgba(255,255,255,.12)}
.bild-card.onayli::before{background:var(--green)}
.bild-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bild-name{font-weight:900;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.04em}
.bild-etiket{display:inline-flex;align-items:center;padding:6px 12px;border-radius:0;font-weight:900;font-size:10.5px;letter-spacing:.12em;background:var(--gold2);color:var(--ink)}
.bild-card.onayli .bild-etiket{background:var(--green)}
.bild-baslik{margin:0 0 6px;font-weight:900;font-size:15px;letter-spacing:.01em}
.bild-date{margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,241,233,.5)}
.bild-parcalar{list-style:none;margin:0 0 14px;padding:0;border-top:2px solid rgba(255,255,255,.5)}
.bild-parcalar li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.14)}
.bild-parcalar .no{font-size:12px;font-weight:900;color:rgba(244,241,233,.45)}
.bild-parcalar a{color:var(--gold2);font-size:11.5px;font-weight:900;letter-spacing:.1em;white-space:nowrap}
.bild-parcalar a:hover{color:var(--cream)}
.bild-not{margin:0 0 16px;padding:10px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;background:rgba(244,241,233,.06);border-left:2px solid var(--pink)}
.bild-not.durum{background:none;border:0;padding:0;color:var(--green);font-weight:900;font-size:12px;letter-spacing:.1em}
.bild-onay{appearance:none;border:0;border-radius:0;background:var(--gold);color:var(--ink);font:inherit;font-weight:900;font-size:12.5px;letter-spacing:.08em;
  padding:14px 20px;min-height:46px;cursor:pointer;box-shadow:5px 5px 0 var(--cream);transition:transform .15s,box-shadow .15s}
.bild-onay:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--cream)}
.bild-onay:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--cream)}
.bild-onay:disabled{opacity:.6;cursor:wait;transform:none}
.bild-hata{margin:10px 0 0;color:#ffb3b3;font-size:13px}
.bild-empty{margin-top:26px;padding:22px;border:1px dashed rgba(255,255,255,.25);color:rgba(244,241,233,.7)}
@media(max-width:560px){
  .bild-card{padding:18px 18px 18px 22px;box-shadow:6px 6px 0 var(--pink)}
  .bild-card.onayli{box-shadow:6px 6px 0 rgba(255,255,255,.12)}
  .bild-onay{width:100%}
  .bild-filtre{flex:1}
  .bild-arka .k3{display:none}
}
@media(prefers-reduced-motion:reduce){.bild-onay{transition:none}}
</style>

</body></html>
