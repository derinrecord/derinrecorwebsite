<!doctype html><html lang="tr" data-dil-otomatik data-baslik-en="Statistics — Derin Record"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>İstatistikler — Derin Record</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=3" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=3"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3"><link rel="stylesheet" href="branch.css"><link rel="stylesheet" href="auth.css?v=20261101a"><link rel="stylesheet" href="glass.css?v=2" /><style>
.admin-stat,.admin-panel{background:var(--glass-bg);border:1px solid var(--glass-line);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow);border-radius:22px}
.ig-bolum{margin:2.2rem 0 0;font-size:.85rem;letter-spacing:.2em;color:#f4f1e9;opacity:.8}
.ig-kutular{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ig-kutu{font:800 .68rem/1.2 Arial,sans-serif;letter-spacing:.1em}
.ig-kutu small{display:block;margin-top:.2rem;font-weight:400;letter-spacing:0;opacity:.6}
.ig-ikili{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ig-uclu{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1rem}
.ig-pano{min-width:0}
.ig-aciklama{margin:-.5rem 0 .8rem;font-size:.78rem;opacity:.65}
.ig-grafik{display:block;width:100%;height:auto}
.ig-grafik text{fill:rgba(255,255,255,.55);font:10px Arial,sans-serif}
.ig-grafik .ig-d{fill:#fff;font-weight:700}
.ig-sira{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.ig-sira li{position:relative;display:flex;justify-content:space-between;gap:.6rem;padding:.5rem .7rem;border-radius:10px;overflow:hidden;font-size:.8rem}
.ig-sira li span{position:relative;z-index:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-sira li b{position:relative;z-index:1}
.ig-sira li i{position:absolute;inset:0 auto 0 0;background:rgba(63,193,201,.22);border-radius:10px}
.ig-sira .ig-bos{opacity:.6}
.ig-tablo{overflow-x:auto}
.ig-tablo .admin-table td,.ig-tablo .admin-table th{white-space:nowrap}
.ig-etiket{font-size:.65rem;padding:2px 8px;border-radius:99px;background:rgba(255,90,90,.18);color:#ff8080}
.ig-uyari{color:#ff9a9a;font-size:.85rem}
@media(max-width:800px){.ig-ikili,.ig-uclu{grid-template-columns:1fr}.ig-kutular{grid-template-columns:1fr 1fr}.ig-grafik text{font-size:16px}}
</style>
