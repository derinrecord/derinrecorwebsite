# Derin Record uygulaması — Android deneme paketi (APK).
# app/ klasörü değişince ya da elle başlatılınca derlenir; çıktı "derin-record-deneme"
# adlı artifact içinde derin-record-deneme.apk olarak indirilir. Gizli anahtar kullanılmaz
# (deneme paketi; mağaza paketi ve imzası sonraki aşamada).
name: Android deneme paketi

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/android-deneme.yml'

permissions:
  contents: write # deneme APK'sı "android-deneme" ön sürümüne konur (telefondan doğrudan indirilir)

jobs:
  apk:
    # ubuntu-24.04 imajında Android SDK hazır kurulu gelir (ANDROID_HOME); ayrı kurulum adımı yok.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK hazır mı
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - name: Capacitor paketlerini kur
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Android projesini oluştur
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android
      - name: APK derle
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK'yı adlandır
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk derin-record-deneme.apk
      - uses: actions/upload-artifact@v4
        with:
          name: derin-record-deneme
          path: derin-record-deneme.apk
          retention-days: 30
      - name: Telefondan indirilecek yere koy (android-deneme ön sürümü)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-deneme >/dev/null 2>&1 || gh release create android-deneme --prerelease --target "$GITHUB_SHA" --title "Derin Record — Android deneme" --notes "Yalnız deneme içindir; mağaza sürümü değildir."
          gh release upload android-deneme derin-record-deneme.apk --clobber
