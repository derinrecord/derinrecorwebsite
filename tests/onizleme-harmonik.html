<style>
/* Derin Record — cam katmanı (marka paletiyle) */

:root{
  --glass-bg:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  --glass-line:rgba(255,255,255,.22);
  --glass-shadow:0 18px 46px rgba(0,0,0,.5),
                 inset 0 1px 0 rgba(255,255,255,.34),
                 inset 0 -1px 0 rgba(255,255,255,.07);
  --glass-blur:blur(24px) saturate(180%);
}

/* --- Üst menü: yüzen cam çubuk --- */
.site-header{
  position:fixed; top:14px; left:50%; width:min(1180px,94vw);
  transform:translateX(-50%);
  padding:14px 26px; border-radius:24px;
  background:var(--glass-bg);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-shadow);
  align-items:center;
}
.site-header::after{
  content:""; position:absolute; inset:0; border-radius:24px; pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 30%,
             transparent 70%,rgba(203,36,104,.16));
  mix-blend-mode:overlay;
}
.site-header > *{position:relative; z-index:1}
.nav-cta{
  border-radius:14px; padding:11px 17px;
  background:linear-gradient(145deg,var(--yellow),#b8992a);
  box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);
}

/* --- Butonlar: cam hap --- */
.button{
  border-radius:18px;
  box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.75);
}
.button-yellow{background:linear-gradient(145deg,#e6c840,#b8992a)}
.button-pink{background:linear-gradient(145deg,#e0357a,#a51a50)}
.button:hover{transform:translateY(-3px) rotate(-1deg)}

/* --- Hero: renkli cam ışıması --- */
.hero::before{
  background-image:none;
  background:radial-gradient(circle,rgba(203,36,104,.55),transparent 68%);
  filter:blur(60px);
}
.hero::after{
  background-image:none;
  background:radial-gradient(circle,rgba(216,187,44,.42),transparent 68%);
  filter:blur(60px);
}

/* --- Hizmet satırları: cam kartlar --- */
.service-list{border-top:0}
.service-list article{
  margin-bottom:14px; padding:22px 24px; border-bottom:0; border-radius:22px;
  background:var(--glass-bg);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-shadow);
  transition:transform .3s cubic-bezier(.2,.8,.3,1),box-shadow .3s;
}
.service-list article:hover{
  transform:translateY(-4px);
  box-shadow:0 26px 58px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.42);
}

/* --- Sezon bölümü: cam pano --- */
.season{position:relative}
.season-copy{
  padding:30px 32px; border-radius:26px;
  background:var(--glass-bg);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-shadow);
}

/* --- Mobil --- */
@media(max-width:760px){
  .site-header{top:10px; width:94vw; padding:12px 18px; border-radius:20px}
  nav{border-radius:18px; top:60px}
}

/* --- Cam desteklenmeyen tarayıcılarda geri dönüş --- */
@supports not (backdrop-filter:blur(1px)){
  .site-header,.service-list article,.season-copy{background:rgba(20,20,24,.9)}
}
/* Sabit menü için üstten pay */
.manifesto,.services,.demos,.season{scroll-margin-top:100px}
h2{padding-top:6px}
.services{padding-top:150px}
.manifesto{padding-top:150px}
/* ============================================
   ALT SAYFALAR (.header + branch.css yapısı)
   aerobik, akrobatik, artistik, ritmik,
   cocuk-fitness, chat, admin, news, license,
   projects, music-request, energy-map ...
   ============================================ */

.header{
  position:sticky; top:12px; z-index:20;
  width:min(1180px,94vw); margin:12px auto 0;
  padding:14px 24px; border-radius:22px;
  border:1px solid var(--glass-line); border-bottom:1px solid var(--glass-line);
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-shadow);
}
.header::after{
  content:""; position:absolute; inset:0; border-radius:22px; pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.2),transparent 32%,
             transparent 68%,rgba(203,36,104,.14));
  mix-blend-mode:overlay;
}
.header > *{position:relative; z-index:1}

/* Sayfa içeriği sabit başlığın altında kalmasın */
main{scroll-margin-top:96px}

/* Hesap / giriş butonları */
.account-button,.home{
  border-radius:14px; padding:10px 16px;
  background:rgba(255,255,255,.07);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  transition:background .2s,transform .2s;
}
.account-button:hover,.home:hover{
  background:rgba(255,255,255,.15); transform:translateY(-2px);
}

/* Kart benzeri yüzeyler */
.panel,.card,.box,.branch-card,.project-card,.news-card,.license-card,.demo-card{
  border-radius:24px;
  background:var(--glass-bg);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-shadow);
}

/* Form alanları */
input:not([type=file]):not([type=checkbox]):not([type=radio]),
textarea,select{
  border-radius:14px;
  border:1px solid var(--glass-line);
  background:rgba(255,255,255,.06);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
input:focus,textarea:focus,select:focus{
  outline:0; border-color:rgba(255,255,255,.45);
  box-shadow:0 0 0 4px rgba(255,255,255,.08);
}

@media(max-width:760px){
  .header{top:8px; width:94vw; padding:12px 16px; border-radius:18px}
}

@supports not (backdrop-filter:blur(1px)){
  .header,.panel,.card,.box{background:rgba(20,20,24,.92)}
}
/* ============================================
   SABİT MENÜ — hamburger yerine cam haplar
   ============================================ */

.site-header .menu-toggle{display:none !important}

.site-header{
  display:flex; flex-wrap:wrap; gap:14px;
  justify-content:space-between;
}

.site-header nav{
  position:static !important;
  display:flex !important; flex-wrap:wrap; align-items:center; gap:8px;
  order:2; flex:1 1 auto; justify-content:center;
  transform:none !important; opacity:1 !important; visibility:visible !important;
  background:none !important; border:0 !important; box-shadow:none !important;
  padding:0 !important; margin:0 !important; height:auto !important;
  max-height:none !important; width:auto !important;
}

.site-header nav a{
  padding:9px 15px; border-radius:14px; font-size:12px;
  letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  -webkit-backdrop-filter:blur(12px) saturate(160%);
  backdrop-filter:blur(12px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .22s cubic-bezier(.2,.8,.3,1),background .22s;
}
.site-header nav a:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.15);
  box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);
}

.site-header .account-actions{order:3}
.site-header .wordmark{order:1}

/* Dar ekranda alta sarsın, yine açık kalsın */
@media(max-width:900px){
  .site-header{padding:12px 16px}
  .site-header nav{order:4; flex:1 1 100%; justify-content:flex-start; gap:6px}
  .site-header nav a{padding:8px 12px; font-size:11px}
}
@media(min-width:1100px){
  .site-header{flex-wrap:nowrap; padding:12px 22px}
  .site-header nav{gap:6px}
  .site-header nav a{padding:8px 12px; font-size:11px}
}
/* Menü + butonlar tek hizada */
@media(min-width:1000px){
  .site-header{
    flex-wrap:nowrap; align-items:center; gap:12px;
    padding:12px 20px; overflow:hidden;
  }
  .site-header .wordmark{order:1; flex:0 0 auto}
  .site-header nav{
    order:2; flex:1 1 auto; justify-content:flex-end;
    gap:4px; min-width:0; overflow:hidden;
  }
  .site-header .account-actions{
    order:3; flex:0 0 auto; display:flex; gap:8px; align-items:center;
  }
  .site-header nav a{
    padding:8px 11px; font-size:10.5px; letter-spacing:.06em;
  }
  .site-header .account-actions a,
  .site-header .account-actions button{
    padding:9px 14px; font-size:10.5px; white-space:nowrap;
  }
}

/* Hiçbir öğe cam çerçeveden taşmasın */
.site-header{overflow:hidden}
.site-header nav a{max-width:100%}
/* Cam kartlar — daha geniş ve ferah */

  padding:34px 38px;

.season-copy{

  border-radius:32px;

.panel,.card,.box,.branch-card,.project-card,.news-card,.license-card,.demo-card{

  border-radius:28px;

@media(max-width:760px){
  .service-list article{padding:24px 22px; border-radius:22px}
  .season-copy{padding:28px 24px; border-radius:24px}
  .panel,.card,.box{padding:22px 20px; border-radius:22px}

/* Menü hapları — çerçeve büyüsün, yazı aynı kalsın */
@media(min-width:1000px){
  .site-header{padding:16px 24px; gap:14px}
  .site-header nav{gap:8px}
  .site-header nav a{
    padding:14px 20px;

    border-radius:18px;

    border-radius:18px;
  }

@media(max-width:999px){
  .site-header nav a{padding:12px 16px; border-radius:16px}

/* Menü hapları — kesin boyut */
.site-header nav a{
  display:inline-flex !important;
  align-items:center !important;
  padding:15px 22px !important;
  border-radius:18px !important;
  line-height:1 !important;
  font-size:11px !important;
}
.site-header .account-actions a,
.site-header .account-actions button{
  display:inline-flex !important;
  align-items:center !important;
  padding:15px 22px !important;
  border-radius:18px !important;
  line-height:1 !important;
}
@media(max-width:999px){
  .site-header nav a,
  .site-header .account-actions a,
  .site-header .account-actions button{
    padding:12px 16px !important;
    border-radius:15px !important;
  }

/* Menü iki sıra: üstte 3, altta 4 */
@media(min-width:1000px){
  .site-header{flex-wrap:wrap !important; padding:14px 22px}

  .site-header nav{
    order:2 !important;
    flex:1 1 auto !important;

<script>
// Ses dosyası tipleri, boyut sınırı ve parçalama yardımcıları.
//
// Hem tarayıcıda (window.DerinAudioTypes) hem Node testlerinde (require) kullanılır.
//
// NEDEN PARÇALAMA VAR
// Supabase ücretsiz planında tek nesne (object) sınırı tam olarak 52.428.800 bayt
// (50 MiB). Canlıda ölçülerek doğrulandı: 52.428.800 bayt kabul edilir,
// 52.428.801 bayt "The object exceeded the maximum allowed size" (HTTP 413) ile
// reddedilir. WAV yaklaşık 10 MB/dakika olduğu için 5 dakikadan uzun kayıtlar bu
// sınırı aşar. Çözüm: dosyayı 45 MB'lık parçalara bölüp sırayla yüklemek.
//
// Parçalar orijinal dosyanın kesintisiz dilimleridir (parça 1 dosya başlığını
// taşır, sonraki parçalar ham devamıdır). Sırayla birleştirildiğinde dosya
// BİT DÜZEYİNDE birebir aynı çıkar; kayıp yoktur, yeniden kodlama yoktur.
(function () {
  var TIPLER = {
    mp3: 'audio/mpeg',
    wav: 'audio/wav',
    wave: 'audio/wav',
    flac: 'audio/flac',
    m4a: 'audio/mp4',
    mp4: 'audio/mp4',
    aac: 'audio/aac',
    ogg: 'audio/ogg',
    oga: 'audio/ogg',
    opus: 'audio/opus',
    aif: 'audio/aiff',
    aiff: 'audio/aiff',
    aifc: 'audio/aiff',
    webm: 'audio/webm',
    caf: 'audio/x-caf'
  };

  // Tek nesne için servis tavanı (ölçülen değer).
  var YUKLEME_SINIRI = 52428800;
  // Parça boyutu sınırın altında tutulur (pay bırakılır).
  var PARCA_BOYUTU = 45 * 1048576;

  var UZANTILAR = Object.keys(TIPLER);

  function uzanti(ad) {
    return (String(ad == null ? '' : ad).split('.').pop() || '').toLowerCase();
  }

  function tip(dosya) {
    var uz = uzanti(dosya && dosya.name);
    return TIPLER[uz] || (dosya && dosya.type) || 'audio/mpeg';
  }

  function gecerli(dosya) {
    return UZANTILAR.indexOf(uzanti(dosya && dosya.name)) !== -1;
  }

  function accept() {
    return UZANTILAR.map(function (e) { return '.' + e; }).join(',') + ',audio/*';
  }

  function desteklenenler() {
    return UZANTILAR.join(', ');
  }

  function boyut(bayt) {
    if (typeof bayt !== 'number' || !isFinite(bayt) || bayt < 0) return '0 KB';
    return bayt >= 1048576
      ? (bayt / 1048576).toFixed(1) + ' MB'
      : Math.max(1, Math.round(bayt / 1024)) + ' KB';
  }

  // Dosyanın bayt aralıklarını döner: 53 MB / 45 MB → [[0,47185920],[47185920,55574528]]
  function dilimSinirlari(toplamBayt, parcaBoyutu) {
    var limit = parcaBoyutu || PARCA_BOYUTU;
    if (!toplamBayt || toplamBayt <= 0) return [[0, 0]];
    var sinirlar = [];
    for (var bas = 0; bas < toplamBayt; bas += limit) {
      sinirlar.push([bas, Math.min(toplamBayt, bas + limit)]);
    }
    return sinirlar;
  }

  function parcaSayisi(toplamBayt) {
    return dilimSinirlari(toplamBayt).length;
  }

  // Yol sonuna eklenen parça etiketi: -p02of03
  function parcaEki(index, toplam) {
    var i = String(index); while (i.length < 2) i = '0' + i;
    var n = String(toplam); while (n.length < 2) n = '0' + n;
    return '-p' + i + 'of' + n;
  }

  var PARCA_DESENI = /-p(\d{2})of(\d{2})(\.[^.\/]+)$/;

  function parcaliMi(path) {
    return PARCA_DESENI.test(String(path == null ? '' : path));
  }

  // "<antrenor>/<proje>-<zaman>-p02of03.wav" → üç parçanın da yolları.
  // Parçalı olmayan yolda tek elemanlı liste döner.
  function parcalariCoz(path) {
    var yol = String(path == null ? '' : path);
    var eslesme = PARCA_DESENI.exec(yol);
    if (!eslesme) return [{ path: yol, index: 1, toplam: 1 }];
    var toplam = parseInt(eslesme[2], 10) || 1;
    var liste = [];
    for (var i = 1; i <= toplam; i++) {
      liste.push({
        path: yol.replace(PARCA_DESENI, parcaEki(i, toplam) + '$3'),
        index: i,
        toplam: toplam
      });
    }
    return liste;
  }

  function buyukMu(dosya) {
    return !!dosya && dosya.size > PARCA_BOYUTU;
  }

  // Parçalı yükleme: tek nesne sınırı aşıldığında dosyayı dilimlere bölüp
  // sırayla yükler. Girdi/çıktı dışarıdan verilir (io) — böylece hem tarayıcı
  // (Supabase storage) hem testler (sahte io) aynı mantığı kullanır.
  //   io.yukle(yol, dilim, tip) -> Promise<{error}>
  //   io.sil(yollar)            -> Promise (isteğe bağlı)
  // Döner: {error, path, toplam} — hata hâlinde yüklenmiş parçalar temizlenir.
  async function parcaliYukle(io, temelYol, dosya, ilerleme) {
    var toplam = parcaSayisi(dosya.size);
    var uz = uzanti(dosya.name);
    var mime = tip(dosya);
    var sinirlar = dilimSinirlari(dosya.size);
    var yuklenen = [];

      if (ilerleme) ilerleme(i, sinirlar.length);
      var yol = temelYol + (toplam > 1 ? parcaEki(i, toplam) : '') + '.' + uz;
      var sonuc = await io.yukle(yol, dosya.slice(sinirlar[i - 1][0], sinirlar[i - 1][1]), mime);
      if (sonuc && sonuc.error) {
        // Yarım kalan parçaları temizle: depoda eksik dosya kalmasın.
        if (yuklenen.length && io.sil) { try { await io.sil(yuklenen); } catch (e) {} }
        return { error: sonuc.error, path: null, toplam: toplam, yol: yol, parca: i };
      }
      yuklenen.push(yol);
    }
    return { error: null, path: yuklenen[0], toplam: toplam, yol: yuklenen[0], parca: 1 };
  }

  var api = {
    TIPLER: TIPLER,
    UZANTILAR: UZANTILAR,
    YUKLEME_SINIRI: YUKLEME_SINIRI,
    PARCA_BOYUTU: PARCA_BOYUTU,
    uzanti: uzanti,
    tip: tip,
    gecerli: gecerli,
    accept: accept,
    desteklenenler: desteklenenler,
    boyut: boyut,
    dilimSinirlari: dilimSinirlari,
    parcaSayisi: parcaSayisi,
    parcaEki: parcaEki,
    parcaliMi: parcaliMi,
    parcalariCoz: parcalariCoz,
    buyukMu: buyukMu,
    parcaliYukle: parcaliYukle
  };

  if (typeof window !== 'undefined') window.DerinAudioTypes = api;
  if (typeof module !== 'undefined') module.exports = api;
})();

// Üç ölçüte bakılır: Camelot ton ilişkisi, tempo (BPM) yakınlığı ve enerji

    if (a.n === b.n) return { tip: 'Paralel majör↔minör', sinif: 'ok', puan: 5 };
    if (a.L === b.L && wrap(a.n + 1) === b.n) return { tip: 'Enerji artışı (+1)', sinif: 'up', puan: 6 };
    if (a.L === b.L && wrap(a.n - 1) === b.n) return { tip: 'Yumuşak iniş (−1)', sinif: 'ok', puan: 4 };
    if (a.L === b.L && wrap(a.n + 2) === b.n) return { tip: 'Enerji sıçraması (+2)', sinif: 'up', puan: 2 };
    if (a.L === b.L && wrap(a.n + 7) === b.n) return { tip: 'Yükseltme (+7)', sinif: 'up', puan: 2 };
    return null;
  }

  // ---- Hedef hız (parçaları tek hıza sabitleme) -------------------------------
  // DJ çoğu zaman setin ana bölümünü tek hıza sabitler: "122 civarı parçaları
  // 126'da çalıyorum" gibi. O zaman 122 ile 130 arasında duyulacak fark kalmaz —
  // ikisi de 126'da çalınır. Motor da böyle saysın: hedefin ±tolerans içindeki
  // parçalar hedef hızda kabul edilir, hedefin üstündekiler setin sonundaki
  // hızlı bölüme ayrılır. Varsayılan kapalıdır; ayar ekrandan verilir.
  //
  // Hızlı bölümün de kendi hedefi vardır: "135'in üstündeki parçalar 145'te
  // çalacak" gibi. Eşiğin üstündeki her parça hızlı hedefe çekilir, böylece
  // hızlı bölüm de tek hızda akar ve 137 ile 152 arasında fark kalmaz.
  const HEDEF_TOLERANS = 4;
  const HIZLI_ESIK = 135;
  const HIZLI_HEDEF = 145;
  // İniş payı: tek bir küçük geri adım serbesttir, ama üst üste binemez. Ölçü
  // komşu adım değil ZİRVEDEN sapmadır — 126 → 125 → 124 → 122 gibi adımlar
  // tek tek küçük görünse de zirveden 4 BPM aşağı iner ve liste iniş sırası
  // gibi okunur. Bu yüzden pay, zirveden toplam sapmayı sınırlar: 2 BPM'lik
  // tek bir dalma serbest, arka arkaya gelen dalmаlar cezalı.
  const INIS_TOLERANS = 2;
  let ayar = {
    hedef: null, tolerans: HEDEF_TOLERANS,
    hizliEsik: HIZLI_ESIK, hizliHedef: HIZLI_HEDEF,
    inisTolerans: INIS_TOLERANS
  };

  function hizAyari(yeni) {
    if (yeni && typeof yeni === 'object') {
      ayar = {
        hedef: Number(yeni.hedef) || null,
        tolerans: yeni.tolerans == null ? HEDEF_TOLERANS : Math.max(0, Number(yeni.tolerans) || 0),
        hizliEsik: yeni.hizliEsik == null ? HIZLI_ESIK : Math.max(0, Number(yeni.hizliEsik) || 0),
        hizliHedef: yeni.hizliHedef === null ? null
          : (yeni.hizliHedef == null || !Number(yeni.hizliHedef) ? HIZLI_HEDEF : Number(yeni.hizliHedef)),
        inisTolerans: yeni.inisTolerans == null
          ? INIS_TOLERANS : Math.max(0, Number(yeni.inisTolerans) || 0)
      };
    }
    return {
      hedef: ayar.hedef, tolerans: ayar.tolerans,
      hizliEsik: ayar.hizliEsik, hizliHedef: ayar.hizliHedef,
      inisTolerans: ayar.inisTolerans
    };
  }

  // Eşiğin üstündeki parça hızlı bölümde tek hıza çekilir mi?
  const hizliSabit = bpm => !!ayar.hedef && !!ayar.hizliHedef
    && Number(bpm) > 0 && Number(bpm) > ayar.hizliEsik;

  // Parçanın çalınacağı hız: eşiğin üstündeyse hızlı hedef, hedef civarındaysa
  // hedef, değilse kendi hızı. (Sıra önemli: 140 BPM'lik parça ana hedefin
  // dışındadır, hızlı hedefe çekilir.)
  function etkinBpm(deger) {
    const bpm = Number(deger && deger.bpm) || 0;
    if (!bpm || !ayar.hedef) return bpm;
    if (hizliSabit(bpm)) return ayar.hizliHedef;
    return Math.abs(bpm - ayar.hedef) <= ayar.tolerans ? ayar.hedef : bpm;
  }

  // Parçanın setteki yeri: hedefin altı açılış, hedefli ve hızlı hedefli
  // parçalar ana/hızlı bölüm, hedefin üstü hızlı bölüm. Hedef kapalıysa etiket
  // yok.
  function hizBolumu(parca) {
    const bpm = Number(parca && parca.bpm) || 0;
    if (!bpm || !ayar.hedef) return null;
    if (hizliSabit(bpm)) return 'hizli';
    const fark = bpm - ayar.hedef;
    if (Math.abs(fark) <= ayar.tolerans) return 'ana';
    return fark > 0 ? 'hizli' : 'giris';
  }

  // Sabitlenen parçalar "hedefe çekilmiş" sayılır: köprü önerisi de hedef hız
  // üzerinden verilir, çünkü kullanıcı zaten orada çalacak.
  const sabitlenen = parca => {
    const bpm = Number(parca && parca.bpm) || 0;
    if (!bpm || !ayar.hedef) return false;
    return hizliSabit(bpm) || Math.abs(bpm - ayar.hedef) <= ayar.tolerans;
  };

  // Tempo ölçüsü. Eşikler DJ pratiğinden: 3 BPM'e kadar fark duyulmaz, 5 BPM
  // perde kaydırmasıyla kapanır. 5 BPM'i aşan iki parça ton tutsa bile yan yana
  // konmaz: 6–12 BPM arası araya köprü ister, 12 BPM sonrası geçiş kendini belli
  // eder. Yarım/çift tempo (62 → 124) ayrı sayılır: kulakta kopukluk değildir.
  const HIZ_TOLERANS = 5;
  const HIZ_SINIR = 12;
  // Yan yana gelmemesi gereken çiftin cezası, en iyi ton geçişinin kazancından
  // (6 × 10 + 6 = 66) büyük olmalı. Böylece hız farkı 5 BPM'i aşan komşuluk
  // hiçbir zaman kârlı çıkmaz; sıralayıcı onu ancak başka çare yokken kabul
  // eder ve ekran köprü önerir.
  const HIZ_AYIR_CEZA = 70;
  const HIZ_COK_CEZA = 95;

  function tempo(a, b) {
    const x = etkinBpm(a), y = etkinBpm(b);
    if (!x || !y) return { fark: null, tip: 'bilinmiyor', ceza: 0 };
    const fark = Math.abs(x - y);
    const hamFark = Math.abs((Number(a && a.bpm) || 0) - (Number(b && b.bpm) || 0)) || fark;
    // Sabitlenmiş çiftin gerçek farkı vardır ama kulakta yoktur; ölçü hedef hız
    // üzerinden, gerçek fark "hamFark" olarak yanında taşınır.
    if (fark <= 3) return { fark, hamFark, tip: 'aynı hız', ceza: 0 };
    if (fark <= HIZ_TOLERANS) return { fark, hamFark, tip: 'yakın hız', ceza: 3 };
    if (fark <= HIZ_SINIR) return { fark, hamFark, tip: 'hız kayması', ceza: HIZ_AYIR_CEZA };
    const yarim = Math.min(Math.abs(x * 2 - y), Math.abs(x - y * 2));
    if (yarim <= 3) return { fark, hamFark, tip: 'yarım/çift tempo', ceza: 6 };
    return { fark, hamFark, tip: 'uyumsuz hız', ceza: HIZ_COK_CEZA };
  }

  // İki parça yan yana konabilir mi? Ton ilişkisi olmalı ve hız farkı 5 BPM'i
  // aşmamalı. Yarım/çift tempo kuralın dışında: 124 ile 62 yan yana gelebilir,
  // çünkü bu kopukluk değil bilinçli bir tercihtir. Hız bilinmiyorsa engel
  // konmaz; eksik veriyi ihlal saymak sıralamayı haksız yere kilitler.
  function yanYana(a, b) {
    if (!relation(a && a.camelot, b && b.camelot)) return false;
    const h = tempo(a, b);
    if (h.fark == null) return true;
    return h.fark <= HIZ_TOLERANS || h.tip === 'yarım/çift tempo';
  }

  // Set yayı (genel bakış). Yerel puan "bu iki parça uyar mı" der; setin eğrisini
  // görmez, çünkü tek tek bakıldığında 122 → 124 ile 124 → 122 eşit derecede
  // yakındır. Oysa set yavaştan hızlıya akmalı: adım adım hız düşüşü ve zirveyi
  // erken harcamak yayı bozar. Ölçüt O(n) kalır (sıralama yapılmaz).
  // Her ters BPM için ceza. Eşik ilkeli: tek bir hamle iki komşuluğu birden
  // değiştirir, her birinde en fazla kopuk cezası kadar (300 + 66) kazanç olur:
  // 2 × 366 = 732. Ceza bundan büyük seçildiği için ton kazancı uğruna hız
  // sırası ASLA bozulmaz: önce yavaştan hızlıya akış, sonra ton uyumu.
  const INIS_CEZA = 800;
  const YAY_CEZA = 3;        // ilk yarı ikinci yarıdan hızlıysa her BPM için
  const ZIRVE_CEZA = 10;     // zirveden sonra izin verilenden fazla parça başına
  const ZIRVE_PAYI = 0.2;    // setin en çok bu kadarı zirveden sonra gelebilir

  // Adım yönü: hızdan yavaşa dönmek yayı bozar. Ölçü HAM BPM üzerindendir —
  // kullanıcı listede ham hızı görür, dolayısıyla liste her zaman yavaştan
  // hızlıya okunmalı. Sabitleme yalnız müzikal mesafeyi (tempo) etkiler.
  function inisCeza(a, b) {
    const x = Number(a && a.bpm) || 0, y = Number(b && b.bpm) || 0;
    if (!x || !y) return 0;
    const dusus = x - y;
    return dusus > ayar.inisTolerans ? (dusus - ayar.inisTolerans) * INIS_CEZA : 0;
  }

  const ortBpm = dizi => {
    const v = dizi.map(t => etkinBpm(t)).filter(Boolean);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
  };

  // Zincirin tamamına bakışı: eğri yükseliyor mu, nerede geri düşüyor, zirve
  // nerede? Ekran bunu yazar; puanı da buradan türetilir ki ikisi ayrışmasın.
  function yay(set) {
    const sira = Array.isArray(set) ? set : [];
    const inisler = [];
    let inisToplam = 0;
    // İnişler ham BPM'den okunur: ekrandaki liste ile ekrandaki uyarı aynı
    // sayıyı göstersin (sabitlenen parçalar etkin hızda eşitleniyor olsa da
    // listede yavaştan hızlıya durmalı). Ölçü zirveden sapmadır, komşu adım
    // değil: küçük adımlarla inen bir dizi de iniş sayılır.
    const tol = ayar.inisTolerans;
    let zirveHam = 0;
    for (let i = 0; i < sira.length; i++) {
      const v = Number(sira[i] && sira[i].bpm) || 0;
      if (!v) continue;
      if (v > zirveHam) zirveHam = v;
      const sapma = zirveHam - v;
      if (i > 0 && sapma > tol) {
        inisler.push({ sira: i, onceki: sira[i - 1], sonraki: sira[i], dusus: sapma });
        inisToplam += sapma - tol;
      }
    }
    const yarim = Math.floor(sira.length / 2);
    const ilkYari = ortBpm(sira.slice(0, yarim));
    const ikinciYari = ortBpm(sira.slice(yarim));
    let zirve = sira[0] || null, zirveYeri = 0, enYavas = sira[0] || null, enYavasYeri = 0;
    sira.forEach((t, i) => {
      const v = etkinBpm(t);
      if (!v) return;
      // Zirvede eşitlik varsa en sondaki sayılır: aynı hızdaki parçaların
      // sırası keyfi olduğu için set yaydan haksız ceza yememeli.
      if (v >= etkinBpm(zirve)) { zirve = t; zirveYeri = i; }
      if (!etkinBpm(enYavas) || v < etkinBpm(enYavas)) { enYavas = t; enYavasYeri = i; }
    });
    const sonrasi = sira.length - 1 - zirveYeri;
    const izinli = Math.floor(sira.length * ZIRVE_PAYI);
    const zirveCezasi = Math.max(0, sonrasi - izinli) * ZIRVE_CEZA;
    const yarimCezasi = Math.max(0, ilkYari - ikinciYari) * YAY_CEZA;
    // Zirveden sapmanın cezası: "adım küçüktü" bahanesiyle oluşan uzun iniş
    // dizileri burada yakalanır (bkz. INIS_TOLERANS).
    const gerilemeCezasi = inisToplam * INIS_CEZA;
    const toplam = zirveCezasi + yarimCezasi + gerilemeCezasi;
    // Ceza yokken -0 sızmasın: ekranda ve testte "0" olarak okunsun.
    const puan = toplam ? -toplam : 0;
    return {
      ilk: etkinBpm(sira[0]) || null,
      son: etkinBpm(sira[sira.length - 1]) || null,
      ilkHam: Number(sira[0] && sira[0].bpm) || null,
      sonHam: Number(sira[sira.length - 1] && sira[sira.length - 1].bpm) || null,
      ilkYari: Math.round(ilkYari), ikinciYari: Math.round(ikinciYari),
      zirve, zirveYeri, zirveSonrasi: sonrasi, zirveCezasi,
      enYavas, enYavasYeri, yarimCezasi, gerilemeCezasi,
      inisler, inisSayi: inisler.length, inisToplam,
      yukselen: inisler.length === 0 && yarimCezasi === 0,
      puan
    };
  }

  const yayPuanu = sira => yay(sira).puan;

  // Tek geçişin puanı. Ton ilişkisi yoksa -Infinity: zincire hiç girmez. Puan
  // yön duyarlıdır: hızdan yavaşa dönmek "inisCeza" ile ayrıca düşer.
  function score(a, b) {
    const r = relation(a && a.camelot, b && b.camelot);
    if (!r) return -Infinity;
    let s = r.puan * 10 - tempo(a, b).ceza - inisCeza(a, b);
    const ea = Number(a && a.energy) || 0, eb = Number(b && b.energy) || 0;
    if (ea && eb) {
      const d = eb - ea;
      if (d >= 0 && d <= 2) s += 6;      // hafif yükseliş: setin en rahat akışı
      else if (d > 3) s -= 4;            // ani sıçrama kopukluk yaratır
      else if (d < -2) s -= 6;           // sert düşüş dinleyiciyi düşürür
    }
    return s;
  }

  // Zincir puanı iki ayrı parçadan oluşur: TON ve HIZ.
  //
  // NEDEN AYRI: eskiden ton ilişkisi olmayan komşuluk sabit -300 alıyordu ve o
  // çiftin hız bilgisi tamamen kayboluyordu. Tonlar dağınık olduğunda (setlerin
  // çoğu böyle) çiftlerin büyük kısmı kopuk kalıyor, dolayısıyla sıralama
  // hız açısından fiilen rastgele çıkıyordu — 12 parçalık setlerin tamamında
  // hız düşüşü görülüyordu. Oysa setin ilk kuralı yavaştan hızlıya akmaktır ve
  // bu, ton uyumundan bağımsız işlemeli. Artık ton cezası (kopuksa -300) ile
  // hız cezası ayrı toplanır: kopuk çiftte de sıra doğru kurulur.
  const KOPUK_CEZA = -300;

  // Yalnız ton ve enerji uyumu: ilişki yoksa kopuk cezası.
  const tonPuanu = (a, b) => {
    const r = relation(a && a.camelot, b && b.camelot);
    if (!r) return KOPUK_CEZA;
    let s = r.puan * 10;
    const ea = Number(a && a.energy) || 0, eb = Number(b && b.energy) || 0;
    if (ea && eb) {
      const d = eb - ea;
      if (d >= 0 && d <= 2) s += 6;      // hafif yükseliş: setin en rahat akışı
      else if (d > 3) s -= 4;            // ani sıçrama kopukluk yaratır
      else if (d < -2) s -= 6;           // sert düşüş dinleyiciyi düşürür
    }
    return s;
  };

  // Yalnız hız: yan yana gelmemesi gereken fark ve hızdan yavaşa dönüş.
  const hizPuanu = (a, b) => -(tempo(a, b).ceza + inisCeza(a, b));

  const baglantiPuanu = (a, b) => tonPuanu(a, b) + hizPuanu(a, b);
  // Zincir puanı = yerel geçişler + setin genel yayı. Genel terim olmadan
  // sıralayıcı aynı komşuluk puanlarıyla hem 96 → 131 hem 131 → 96 dizisini
  // kurabilir; yay terimi yavaştan hızlıya olanı seçtirir.
  const zincirPuanu = sira =>
    sira.slice(1).reduce((toplam, x, i) => toplam + baglantiPuanu(sira[i], x), 0)
    + yayPuanu(sira);  // Yerel arama. Üç hamle denenir: yer değiştirme (swap), kaydırma (insertion)
  // ve bölüt ters çevirme (reversal). Zincir puanı simetrik değildir — 8A→9A ile
  // 9A→8A aynı puanı vermez — bu yüzden yön de aranır. Yalnız swap, açgözlü
  // çözümün yakınındaki yerel en iyide takılı kalıyordu; kaydırma ve ters
  // çevirme onu daha iyiye taşır. Her kabul puanı kesin artırdığı için döngü
  // sonludur; tur sınırı yine de var.
  //
  // "kabul" verilirse hamle önce ona sorulur: blok düzeninde arama blokların
  // yerini değiştiremez, yalnız içlerini iyileştirir.
  function yerelArama(baslangic, kabul) {
    let en = baslangic.slice();
    let enPuan = zincirPuanu(en);
    const n = en.length;
    // Kaydırma O(n²) deneme × O(n) puan = O(n³); uzun setlerde yalnız
    // swap/reversal koşar (canlı set ~30 parça, sınır rahat yetiyor).
    const kaydirmaVar = n <= 60;
    const dene = dizi => {
      if (kabul && !kabul(dizi)) return false;
      const p = zincirPuanu(dizi);
      if (p > enPuan + 1e-9) { en = dizi; enPuan = p; return true; }
      return false;
    };
    for (let tur = 0; tur < 60; tur++) {
      let iyilesti = false;
      for (let i = 0; i < n - 1; i++) {
        for (let j = i + 1; j < n; j++) {
          const takas = en.slice();
          const gecici = takas[i];
          takas[i] = takas[j];
          takas[j] = gecici;
          if (dene(takas)) iyilesti = true;
          const ters = en.slice(0, i).concat(en.slice(i, j + 1).reverse(), en.slice(j + 1));
          if (dene(ters)) iyilesti = true;
        }
      }
      if (kaydirmaVar) {
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            if (i === j) continue;
            const kaydir = en.slice();
            const tasinan = kaydir.splice(i, 1)[0];
            kaydir.splice(j, 0, tasinan);
            if (dene(kaydir)) iyilesti = true;
          }
        }
      }
      if (!iyilesti) break;
    }
    return en;
  }

  // Tonu olmayan parçalar yerel puana giremez (komşuluk her yerde kopuk), ama
  // tempoları var. Setin yayını bozmasınlar diye hız sırasındaki yerlerine
  // girerler: her parça, kendisinden yavaş olanların hemen ardına.
  function hizYerlestir(sira, tonsuz) {
    const sonuc = sira.slice();
    tonsuz.forEach(t => {
      const v = Number(t && t.bpm) || 0;
      let yer = sonuc.length;
      if (v) {
        yer = sonuc.findIndex(x => (Number(x && x.bpm) || Infinity) > v);
        if (yer < 0) yer = sonuc.length;
      }
      sonuc.splice(yer, 0, t);
    });
    return sonuc;
  }

  // Açgözlü zincir + yerel arama ile tek bir kümenin en iyi dizilimi: her
  // başlangıç denenir, sonra zincir iyileştirilir.
  function enIyiDizi(liste) {
    const tonlu = liste.filter(t => parseKey(t && t.camelot));
    const tonsuz = liste.filter(t => !parseKey(t && t.camelot));
    if (tonlu.length < 2) return hizYerlestir(liste, []);
    const greedy = start => {
      const kalan = tonlu.filter(t => t.id !== start.id);
      const sira = [start];
      while (kalan.length) {
        const son = sira[sira.length - 1];
        let enIyi = -Infinity, enIdx = 0;
        kalan.forEach((t, i) => {
          const p = baglantiPuanu(son, t);
          if (p > enIyi) { enIyi = p; enIdx = i; }
        });
        sira.push(kalan[enIdx]);
        kalan.splice(enIdx, 1);
      }
      return sira;
    };
    let en = greedy(tonlu[0]), enPuan = zincirPuanu(en);
    for (const baslangic of tonlu.slice(1)) {
      const deneme = greedy(baslangic), p = zincirPuanu(deneme);
      if (p > enPuan) { en = deneme; enPuan = p; }
    }
    // Hız sırası tohumu. Harmonik zincir tek başına sırayı savsaklayabiliyor;
    // yavaştan hızlıya dizilmiş iskelet her zaman elde olduğu için aramaya
    // tohum olarak verilir. Yerel arama bundan sonra sırayı bozmadan ton
    // uyumunu iyileştirir (ağırlıklar gereği bozacak kadar kazanamaz).
    const sirali = tonlu.slice().sort((x, y) => (etkinBpm(x) || Infinity) - (etkinBpm(y) || Infinity));
    // İki tohum da yerel aramadan geçirilir: harmonik zincir ton uyumunu,
    // hız sırası tohumu tempoyu temsil eder. Kazananı zincir puanı seçer.
    let kazanan = yerelArama(en);
    const siraliSonuc = yerelArama(sirali);
    if (zincirPuanu(siraliSonuc) > zincirPuanu(kazanan)) kazanan = siraliSonuc;
    return hizYerlestir(kazanan, tonsuz);
  }

  // Hedef hız açıkken set üç bölümdür: açılış (hedefin altı), ana bölüm (hedefe
  // sabitlenenler), hızlı bölüm (hedefin üstü). Kullanıcının kafasındaki sıra
  // budur — "hızlılar sonraki hızlı bölüm için" — bu yüzden arama blokların
  // yerini değiştirmez, yalnız içlerindeki dizilimi iyileştirir.
  const BOLUM_SIRASI = ['giris', 'ana', 'hizli'];

  function blokluDizi(hepsi) {
    const bolumler = { giris: [], ana: [], hizli: [] };
    hepsi.forEach(t => {
      const ad = hizBolumu(t);
      (ad && bolumler[ad] ? bolumler[ad] : bolumler.ana).push(t);
    });
    const parcalar = [];
    BOLUM_SIRASI.forEach(ad => { parcalar.push(...enIyiDizi(bolumler[ad])); });

    // Son cilalama: blok sırası korunurken (yalnız blok içi ve komşu blok
    // sınırları) zincir puanı iyileştirilir.
    const bolge = new Map();
    BOLUM_SIRASI.forEach(ad => bolumler[ad].forEach(t => bolge.set(t.id, ad)));
    const blokKoruyucu = dizi => {
      let onceki = -1;
      const gorulen = new Set();
      for (const t of dizi) {
        const sira = BOLUM_SIRASI.indexOf(bolge.get(t.id));
        if (sira < onceki) return false;          // blok geriye dönemez
        if (sira !== onceki) {
          if (gorulen.has(sira)) return false;    // blok ikinci kez başlayamaz
          gorulen.add(sira);
          onceki = sira;
        }
      }
      return true;
    };
    return yerelArama(parcalar, blokKoruyucu);
  }

  // Sıralama: hedef hız verilmişse bölüm bölüm (açılış → ana → hızlı), yoksa
  // setin tamamı tek zincir olarak çözülür.
  //
  // Öncelik sırası: ÖNCE hız sırası, SONRA ton uyumu. Set her zaman yavaştan
  // hızlıya akar; ton zinciri bu iskeletin içinde aranır (bkz. INIS_CEZA).
  function autoOrder(list) {
    const hepsi = Array.isArray(list) ? list.slice() : [];
    if (ayar.hedef) return blokluDizi(hepsi);
    return enIyiDizi(hepsi);
  }

  // Her geçişin okunur hâli: seviye 'iyi' | 'zorlama' | 'uyumsuz'.
  function gecisler(set) {
    const sira = Array.isArray(set) ? set : [];
    const out = [];
    for (let i = 1; i < sira.length; i++) {
      const onceki = sira[i - 1], sonraki = sira[i];
      const iliski = relation(onceki && onceki.camelot, sonraki && sonraki.camelot);
      const hiz = tempo(onceki, sonraki);
      const sorunlar = [];
      if (!iliski) sorunlar.push('ton uyumsuz');
      else if (iliski.puan <= 2) sorunlar.push('ton geçişi zorlama');
      if (hiz.tip === 'uyumsuz hız') sorunlar.push('tempo uyumsuz');
      else if (hiz.tip === 'hız kayması') {
        sorunlar.push('tempo kayması');
        // Ton tutuyor da olsa bu iki parça yan yana konmamalı: sebebi tek
        // cümlede yazılır ki köprünün neden gerektiği okunabilsin.
        if (iliski) sorunlar.push('ton uyumlu ama ' + hiz.fark + ' BPM fark var');
      }
      // Yay yönü: set yavaştan hızlıya akmalı, bu adım geriye dönüyor.
      const dusus = (Number(onceki && onceki.bpm) || 0) - (Number(sonraki && sonraki.bpm) || 0);
      const inis = dusus > ayar.inisTolerans ? { dusus, ceza: inisCeza(onceki, sonraki) } : null;
      if (inis) sorunlar.push('hızdan yavaşa dönüş (' + dusus + ' BPM)');
      const seviye = (!iliski || hiz.tip === 'uyumsuz hız') ? 'uyumsuz'
        : ((iliski.puan <= 2 || hiz.tip === 'hız kayması' || inis) ? 'zorlama' : 'iyi');
      out.push({
        sira: i, onceki, sonraki, iliski, hiz, sorunlar, seviye, inis,
        // Komşuluk kuralı: ton uyumlu + hız farkı en çok 5 BPM.
        yanYana: yanYana(onceki, sonraki),
        puan: baglantiPuanu(onceki, sonraki)
      });
    }
    return out;
  }

  // İki komşuya da ton olarak bağlanan anahtarlar: köprü parçasının tonu.
  function kopruTonlari(a, b) {
    return TUM_TONLAR
      .map(ton => {
        const ra = relation(a && a.camelot, ton), rb = relation(ton, b && b.camelot);
        return (ra && rb) ? { ton, puan: ra.puan + rb.puan } : null;
      })
      .filter(Boolean)
      .sort((x, y) => y.puan - x.puan);
  }

  // Bir parçadan doğrudan çıkılabilen tonlar: iki köprü gerektiğinde ilk
  // köprünün tonu bunlardan biri olmalı (önceki parça ona bağlanır).
  function cikilanTonlar(parca) {
    return TUM_TONLAR
      .map(ton => {
        const r = relation(parca && parca.camelot, ton);
        return r ? { ton, puan: r.puan } : null;
      })
      .filter(Boolean)
      .sort((x, y) => y.puan - x.puan);
  }

  // Bir parçaya doğrudan bağlanan tonlar: son köprünün tonu bunlardan biri
  // olmalı (o ton sonraki parçaya bağlanır).
  function girilenTonlar(parca) {
    return TUM_TONLAR
      .map(ton => {
        const r = relation(ton, parca && parca.camelot);
        return r ? { ton, puan: r.puan } : null;
      })
      .filter(Boolean)
      .sort((x, y) => y.puan - x.puan);
  }

  // Aralarındaki hız farkı tek köprüyle kapanmayan iki parça için iki adımlı
  // yol: her köprü kendi komşusunun hızına yakın olur, tonları da iki yaka
  // arasında zincir kurmalı (a → 1. köprü → 2. köprü → b).
  function ikiAdimYolu(a, b) {
    const x = etkinBpm(a), y = etkinBpm(b);
    const cikis = cikilanTonlar(a), giris = girilenTonlar(b);
    if (!cikis.length || !giris.length) return null;
    const ornek = [];
    cikis.forEach(c => giris.forEach(g => {
      const ara = relation(c.ton, g.ton);
      if (ara) ornek.push({ birinci: c.ton, ikinci: g.ton, puan: c.puan + ara.puan + g.puan });
    }));
    ornek.sort((u, v) => v.puan - u.puan);
    const hiz = bpm => bpm ? { bpmMin: Math.round(bpm - HIZ_TOLERANS), bpmMax: Math.round(bpm + HIZ_TOLERANS) } : { bpmMin: null, bpmMax: null };
    return {
      birinci: { taraf: 'önceki', tonlar: cikis.slice(0, 3).map(c => c.ton), ...hiz(x) },
      ikinci: { taraf: 'sonraki', tonlar: giris.slice(0, 3).map(g => g.ton), ...hiz(y) },
      ornek: ornek.slice(0, 3)
    };
  }

  // Uymayan bir geçişe araya girecek parçanın tonu ve hızı. BPM aralığı iki
  // komşunun da toleransına giren kesişimdir; kesişim boşsa tek parça yetmez.
  function kopru(a, b) {
    const tonlar = kopruTonlari(a, b).map(x => x.ton).slice(0, 3);
    const x = etkinBpm(a), y = etkinBpm(b);
    let bpmMin = null, bpmMax = null, tekParca = true, not = '';
    if (x && y) {
      const alt = Math.min(x, y), ust = Math.max(x, y);
      bpmMin = Math.round(ust - HIZ_TOLERANS);
      bpmMax = Math.round(alt + HIZ_TOLERANS);
      if (bpmMin > bpmMax) {
        tekParca = false;
        const orta = Math.round((alt + ust) / 2);
        bpmMin = orta - 3;
        bpmMax = orta + 3;
        not = 'İki parça arasında ' + (ust - alt) + ' BPM var; tek köprü ikisini de tutmaz. '
          + 'Ya iki köprü kullan ya da bir ucu ' + orta + ' BPM civarına kaydır.';
      }
    }
    if (!tonlar.length) {
      not = not || 'Ton bilgisi eksik: iki parçanın da Camelot kodu girilmeli.';
    }
    // Tek parça yetmiyorsa iki adımın ton ve hızını ayrı ayrı ver.
    const ikiAdim = tekParca ? null : ikiAdimYolu(a, b);
    return { tonlar, bpmMin, bpmMax, tekParca, not, ikiAdim };
  }

  // Setteki parçalara en çok bağlanan anahtarlar: yeni parça ararken hangi
  // tonun işe yaradığını söyler.
  function uyumluTonlar(set, adet) {
    const sira = (Array.isArray(set) ? set : []).filter(t => parseKey(t && t.camelot));
    if (!sira.length) return [];
    return TUM_TONLAR
      .map(ton => ({
        ton,
        sayi: sira.filter(t => relation(t.camelot, ton) || relation(ton, t.camelot)).length
      }))
      .filter(x => x.sayi)
      .sort((a, b) => b.sayi - a.sayi)
      .slice(0, Number(adet) || 3);
  }

  // Setin içinde hiçbir parçaya ton olarak bağlanmayan parçalar: bunlar setin
  // neresine konursa konsun kopukluk yaratır. Yalnız komşusuna uymayan parça
  // buraya girmez; o geçişin sorunudur ve köprü önerisiyle çözülür.
  function uymayanlar(set) {
    const sira = Array.isArray(set) ? set : [];
    // Tek tonlu parça kalırsa (ötekilerin tonu yoksa) o parça "bağlanamıyor"
    // sayılmaz: kusur eksik ton bilgisindedir, o da ayrıca yazılır.
    const tonluSayi = sira.filter(t => parseKey(t && t.camelot)).length;
    const out = [];
    sira.forEach((t, i) => {
      if (!parseKey(t && t.camelot)) {
        out.push({ parca: t, sira: i, sebep: 'Camelot tonu yok' });
        return;
      }
      if (tonluSayi < 2) return;
      const bagli = sira.some((x, j) => j !== i
        && (relation(t.camelot, x.camelot) || relation(x.camelot, t.camelot)));
      if (!bagli) out.push({ parca: t, sira: i, sebep: 'setteki hiçbir parçaya ton olarak bağlanmıyor' });
    });
    return out;
  }

  // Setteki hiçbir parçaya ton olarak bağlanmayan katalog parçaları: sete
  // alınamazlar, yerlerine uyumlu bir parça gerekir.
  function setDisiKalanlar(set, katalog) {
    const sira = (Array.isArray(set) ? set : []).filter(t => parseKey(t && t.camelot));
    if (!sira.length) return [];
    const settekiIdler = new Set(sira.map(t => t.id));
    return (Array.isArray(katalog) ? katalog : [])
      .filter(t => parseKey(t && t.camelot) && !settekiIdler.has(t.id))
      .filter(t => !sira.some(s => relation(s.camelot, t.camelot) || relation(t.camelot, s.camelot)));
  }

  // Tarz etiketi. Katalogda tür alanı yok; tempo, enerji ve makam üçlüsünden
  // okunur. Etiket yalnız süs değil: dış servis aramasına da girer, böylece
  // öneri aynı tarzda kalsın (ör. "Mahmut Orhan benzeri melodic house").
  function tarzEtiketi(parca) {
    const bpm = Number(parca && parca.bpm) || 0;
    const enerji = Number(parca && parca.energy) || 0;
    const govde = !bpm ? 'tempo bilinmiyor'
      : bpm < 100 ? 'downtempo / lounge'
      : bpm < 115 ? 'organik deep house'
      : bpm < 125 ? 'melodic house'
      : bpm < 133 ? 'progressive house'
      : 'yüksek enerji / tech';
    const eki = enerji >= 7 ? ' (yoğun)' : (enerji && enerji <= 3 ? ' (sakin)' : '');
    return ((parca && parca.makam) ? 'Anadolu elektronik · ' : '') + govde + eki;
  }

  // Katalogdaki sanatçıların tarz imzası: parçalarından çıkan hız, enerji ve
  // ton eğilimi. "Mahmut Orhan tarzı nedir?" sorusunun elimizdeki veriyle
  // cevabı budur; dışarıdan hiçbir şey çekmeden hesaplanır.
  function sanatciProfilleri(katalog) {
    const harita = new Map();
    (Array.isArray(katalog) ? katalog : []).forEach(t => {
      const ad = String((t && t.artist) || '').trim();
      if (!ad) return;
      if (!harita.has(ad)) harita.set(ad, { sanatci: ad, parcalar: [], tonSayi: {}, makamlar: {}, bpmToplam: 0, bpmSayi: 0, enerjiToplam: 0, enerjiSayi: 0 });
      const p = harita.get(ad);
      p.parcalar.push(t);
      if (t.camelot) p.tonSayi[t.camelot] = (p.tonSayi[t.camelot] || 0) + 1;
      if (t.makam) p.makamlar[t.makam] = (p.makamlar[t.makam] || 0) + 1;
      if (Number(t.bpm)) { p.bpmToplam += Number(t.bpm); p.bpmSayi++; }
      if (Number(t.energy)) { p.enerjiToplam += Number(t.energy); p.enerjiSayi++; }
    });
    return [...harita.values()].map(p => {
      const bpm = p.bpmSayi ? Math.round(p.bpmToplam / p.bpmSayi) : null;
      const enerji = p.enerjiSayi ? Math.round(p.enerjiToplam / p.enerjiSayi) : null;
      const enCokTonlar = Object.entries(p.tonSayi).sort((a, b) => b[1] - a[1]).map(x => x[0]);
      const enCokMakam = Object.keys(p.makamlar)[0] || null;
      return {
        sanatci: p.sanatci, parcalar: p.parcalar, bpm, enerji, tonSayi: p.tonSayi,
        enCokTonlar, makamlar: Object.keys(p.makamlar),
        tarz: tarzEtiketi({ bpm, energy: enerji, makam: enCokMakam })
      };
    }).sort((a, b) => b.parcalar.length - a.parcalar.length) ;
  }

  // Bir parça setin neresine girebilir? Tonu uyan ve hızı 5 BPM içinde kalan
  // komşular listelenir; boş liste "bu parça sete girmez" demektir.
  function settekiYeri(set, parca) {
    return (Array.isArray(set) ? set : []).filter(s => s.id !== parca.id
      && (relation(s.camelot, parca.camelot) || relation(parca.camelot, s.camelot))
      && (yanYana(s, parca) || yanYana(parca, s)));
  }

  // Katalogdan, sete gerçekten girebilecek sanatçılar: her sanatçının setle hem
  // tonu hem hızı uyan parçaları varsa önerilir. Dışarıya çıkmadan "bu tarz
  // buraya uyar" diyebilmenin yolu.
  function uyumluSanatcilar(set, katalog, adet) {
    const sira = Array.isArray(set) ? set : [];
    const settekiIdler = new Set(sira.map(t => t && t.id));
    return sanatciProfilleri(katalog)
      .map(p => {
        const uyan = p.parcalar.filter(t => t && !settekiIdler.has(t.id) && settekiYeri(sira, t).length);
        if (!uyan.length) return null;
        const bpmlar = uyan.map(t => Number(t.bpm)).filter(Boolean);
        return {
          sanatci: p.sanatci, tarz: p.tarz, bpm: p.bpm, enerji: p.enerji,
          parcalar: uyan,
          enCokTonlar: p.enCokTonlar.filter(ton => uyan.some(t => t.camelot === ton)),
          bpmMin: bpmlar.length ? Math.min(...bpmlar) : null,
          bpmMax: bpmlar.length ? Math.max(...bpmlar) : null
        };
      })
      .filter(Boolean)
      .sort((a, b) => b.parcalar.length - a.parcalar.length)
      .slice(0, Number(adet) || 5);
  }

  // Dış servis anahtarı yok: öneri gerçek şarkı listesi değil, arama
  // bağlantısıdır. Sorgu ton + hız taşır, sonucu kullanıcı seçer. Sanatçı ve
  // tarz verilirse sorguya girer ("Mahmut Orhan benzeri melodic house …"),
  // böylece öneri parçanın tarzında kalır.
  function aramaLinkleri(sorgu) {
    const kod = encodeURIComponent(String(sorgu == null ? '' : sorgu).trim());
    return {
      youtube: 'https://www.youtube.com/results?search_query=' + kod,
      spotify: 'https://open.spotify.com/search/' + kod
    };
  }

  function oneriSorgusu(hedef) {
    const h = hedef || {};
    const ton = Array.isArray(h.tonlar) && h.tonlar.length ? h.tonlar.slice(0, 2).join(' ') : '';
    const hiz = (h.bpmMin && h.bpmMax)
      ? (h.bpmMin === h.bpmMax ? h.bpmMin + ' BPM' : h.bpmMin + '-' + h.bpmMax + ' BPM')
      : (h.bpm ? h.bpm + ' BPM' : '');
    const tarz = [h.sanatci ? String(h.sanatci) + ' benzeri' : '', h.tarz || ''].filter(Boolean).join(' ');
    return [tarz, ton, hiz].filter(Boolean).join(' ') + ' mix';
  }

  return {
    parseKey, relation, tempo, score, autoOrder, gecisler, yanYana, inisCeza,
    hizAyari, etkinBpm, hizBolumu, sabitlenen, hizliSabit, tonPuanu, hizPuanu,
    yay, yayPuanu, kopru, kopruTonlari, cikilanTonlar, girilenTonlar, uyumluTonlar,
    uymayanlar, setDisiKalanlar, aramaLinkleri, oneriSorgusu, zincirPuanu,
    tarzEtiketi, sanatciProfilleri, settekiYeri, uyumluSanatcilar,
    HIZ_TOLERANS, HIZ_SINIR, HIZ_AYIR_CEZA, HIZ_COK_CEZA, KOPUK_CEZA,
    INIS_TOLERANS, INIS_CEZA, ZIRVE_CEZA, HIZLI_ESIK, HIZLI_HEDEF
  };
});

</script>
<script>
(() => {
  const byId = id => document.getElementById(id);
  const safe = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Sıralama/skor/geçiş hesabı harmonic-set.js'te: burası yalnız çizer ve yazar.
  const H = window.DerinHarmonicSet;
  const parseKey = H.parseKey;
  // Ses dosyası yardımcıları tek kaynaktan gelir: audio-file-types.js.
  // Supabase ücretsiz planda tek nesne sınırı 50 MiB (52.428.800 bayt); uzun bir
  // WAV bunu aşar ve ham yükleme "size çok büyük" hatası verir.
  const Ses = window.DerinAudioTypes;

  let client = null, tracks = [], set = [], selected = null;

  async function boot() {
    await window.DerinAuth.ready;
    const a = window.DerinAuth; client = a.client;
    const st = byId('hm-status');
    if (!a.configured) { st.textContent = 'Bağlantı hazırlanıyor.'; return; }
    if (!a.user) { st.innerHTML = '<button class="account-button" id="hm-login">GİRİŞ YAP</button>';
      byId('hm-login').onclick = () => a.open(); return; }
    if (a.profile?.role !== 'admin') { st.textContent = 'Bu araç yalnızca yöneticilere açıktır.'; return; }
    st.textContent = '';
    ayarYukle();          // hedef hız tercihi tarayıcıdan okunur
    byId('hm-app').hidden = false;
    await load();
  }

  // Parçalı yüklemeyi mümkün kılan yardımcılar yoksa (eski önbellek) yükleme
  // yerine açık bir uyarı verilir; sessizce ham yüklemeye düşülmez.
  const sesHazir = () => !!(Ses && Ses.parcaliYukle && Ses.parcalariCoz);

  const djDepo = () => client.storage.from('dj-audio');

  // Kova belirli bir MIME listesiyle kısıtlanmışsa tarayıcının bildirdiği tip
  // reddedilir; bu durumda jenerik tip ile bir kez daha denenir.
  async function djYukle(yol, dilim, tip) {
    const ilk = await djDepo().upload(yol, dilim, { contentType: tip || 'audio/mpeg', upsert: false });
    if (!ilk.error) return { path: yol, error: null };
    if (/mime|content.?type/i.test(ilk.error.message || '')) {
      const ikinci = await djDepo().upload(yol, dilim, { contentType: 'application/octet-stream', upsert: false });
      if (!ikinci.error) return { path: yol, error: null };
      return { path: null, error: ikinci.error };
    }
    return { path: null, error: ilk.error };
  }
  const imzaliUrl = async path => {
    const { data, error } = await djDepo().createSignedUrl(path, 3600);
    return error ? null : data.signedUrl;
  };

  // Parçalı dosya tek bir nesne gibi çalınamaz: parçalar indirilip tarayıcıda
  // birleştirilir. Tek parçada doğrudan imzalı adres kullanılır.
  let aktifBlobUrl = null;
  async function sesUrl(path) {
    if (!sesHazir() || !Ses.parcaliMi(path)) return imzaliUrl(path);
    const parcalar = [];
    for (const p of Ses.parcalariCoz(path)) {
      const url = await imzaliUrl(p.path);
      if (!url) return null;
      const cevap = await fetch(url);
      if (!cevap.ok) return null;
      parcalar.push(await cevap.blob());
    }
    if (aktifBlobUrl) { try { URL.revokeObjectURL(aktifBlobUrl); } catch (e) {} }
    aktifBlobUrl = URL.createObjectURL(new Blob(parcalar, { type: 'audio/mpeg' }));
    return aktifBlobUrl;
  }

  async function load() {
    const { data, error } = await client.from('dj_tracks')
      .select('id,title,artist,audio_path,camelot,key_name,makam,bpm,energy,duration_sec')
      .order('created_at', { ascending:false });
    if (error) { byId('hm-status').textContent = error.message; return; }
    tracks = data || [];
    set = set.map(s => tracks.find(t => t.id === s.id)).filter(Boolean);
    render();
  }

  function suggestions() {
    const last = set.length ? set[set.length - 1] : selected;
    if (!last) return [];
    return tracks.filter(t => t.id !== last.id && !set.some(s => s.id === t.id))
      .map(t => ({ t, rel: H.relation(last.camelot, t.camelot), p: H.score(last, t) }))
      .filter(x => x.rel).sort((a, b) => b.p - a.p);
  }

  const keyChip = t => t.camelot
    ? `<span class="hm-key ${parseKey(t.camelot)?.L === 'B' ? 'b' : ''}">${safe(t.camelot)}</span>`
    : '<span class="hm-key" style="opacity:.4">ton yok</span>';

  const meta = t => [t.artist, t.key_name, t.makam, t.bpm ? t.bpm + ' BPM' : null, t.energy ? 'E' + t.energy : null]
    .filter(Boolean).map(safe).join(' · ') || 'meta veri eksik';

  // Öneri bağlantısı: dış servis anahtarı yok, arama sorgusuna götürür.
  function linkHtml(hedef) {
    const sorgu = H.oneriSorgusu(hedef);
    const l = H.aramaLinkleri(sorgu);
    return `<span class="hm-links">
      <span class="hm-chip">${safe(sorgu)}</span>
      <a class="hm-link" href="${safe(l.youtube)}" target="_blank" rel="noopener">YouTube'da ara ↗</a>
      <a class="hm-link" href="${safe(l.spotify)}" target="_blank" rel="noopener">Spotify'da ara ↗</a>
    </span>`;
  }

  const hizMetni = h => (h.bpmMin && h.bpmMax)
    ? (h.bpmMin === h.bpmMax ? h.bpmMin + ' BPM' : h.bpmMin + '–' + h.bpmMax + ' BPM')
    : 'hız bilgisi yok';

  const tonMetni = h => (h.tonlar && h.tonlar.length) ? h.tonlar.join(' · ') : 'ton bilgisi yok';

  // ---- Tarz önerisi: Deezer'ın benzer sanatçı algoritması --------------------
  // Spotify ve YouTube API anahtarı yok; tarayıcıdan api.deezer.com'a düz fetch
  // CORS'a takılır (allow-origin başlığı yok) ama Deezer JSONP destekliyor:
  // veri <script> ile okunur. Sonuç sanatçı bazında önbelleğe alınır ki her
  // çizimde yeniden sorulmasın.
  let dzSayac = 0;
  const tarzOnbellek = new Map();
  let tarzDurum = { sanatci: null, veri: null, hata: null, yukleniyor: false };

  function deezerOku(yol, parametreler) {
    return new Promise((cozum, ret) => {
      const ad = 'derinDz' + (++dzSayac);
      const betik = document.createElement('script');
      const temizle = () => { try { delete window[ad]; } catch (e) { window[ad] = null; } betik.remove(); };
      const zaman = setTimeout(() => { temizle(); ret(new Error('yanıt gelmedi')); }, 8000);
      window[ad] = veri => { clearTimeout(zaman); temizle(); cozum(veri); };
      const sorgu = new URLSearchParams(Object.assign({}, parametreler, { output: 'jsonp', callback: ad }));
      betik.src = 'https://api.deezer.com/' + yol + '?' + sorgu.toString();
      betik.onerror = () => { clearTimeout(zaman); temizle(); ret(new Error('bağlantı kurulamadı')); };
      document.head.appendChild(betik);
    });
  }

  async function tarzGetir(sanatci) {
    if (tarzOnbellek.has(sanatci)) return tarzOnbellek.get(sanatci);
    const ara = await deezerOku('search/artist', { q: sanatci, limit: 1 });
    const kaynak = ara && ara.data && ara.data[0];
    if (!kaynak) throw new Error('Deezer\'da bulunamadı');
    const benzer = await deezerOku('artist/' + kaynak.id + '/related', { limit: 10 });
    const liste = (benzer && benzer.data) || [];
    // İlk beş sanatçının öne çıkan parçaları da alınır: öneri sanatçı adı değil,
    // dinlenebilir parça olsun (30 sn önizleme Deezer'dan gelir).
    const ilk = await Promise.all(liste.slice(0, 5).map(async a => {
      try {
        const top = await deezerOku('artist/' + a.id + '/top', { limit: 2 });
        return Object.assign({}, a, { parcalar: (top && top.data) || [] });
      } catch (e) {
        return Object.assign({}, a, { parcalar: [] });
      }
    }));
    const veri = { kaynak, benzer: ilk.concat(liste.slice(5).map(a => Object.assign({}, a, { parcalar: [] }))) };
    tarzOnbellek.set(sanatci, veri);
    return veri;
  }

  // Referans parçanın ardından gelecek parçanın hedefi: yay yükseldiği için hız
  // bir adım yukarısı, ton da referanstan çıkılabilen tonlar.
  const tarzHedefi = t => {
    const bpm = Number(t && t.bpm) || null;
    return {
      tonlar: H.cikilanTonlar(t).slice(0, 3).map(x => x.ton),
      bpm,
      bpmMin: bpm,
      bpmMax: bpm ? bpm + H.HIZ_TOLERANS : null
    };
  };

  // ---- Hedef hız ayarı ------------------------------------------------------
  // Kullanıcının çalışma biçimi: "şu civardaki parçaları şu hıza sabitliyorum,
  // hızlılar sonraki hızlı bölüm için". Ayar tarayıcıda saklanır ki her açılışta
  // yeniden girilmesin; motorun varsayılanı nötr kalır.
  const AYAR_ANAHTARI = 'derin-harmonik-hiz-ayari';
  const VARSAYILAN_AYAR = { hedef: 126, tolerans: 4, hizliEsik: 135, hizliHedef: 145, inisTolerans: 2 };
  // İniş payı: tek bir küçük geri adım serbest, üst üste binemez. Ölçü komşu
  // adım değil zirveden sapmadır (motor tarafında INIS_TOLERANS).
  const INIS_PAYI_VARSAYILAN = 2;

  function ayarYukle() {
    let ayar = VARSAYILAN_AYAR;
    try {
      const ham = localStorage.getItem(AYAR_ANAHTARI);
      if (ham) {
        const okunan = JSON.parse(ham);
        ayar = {
          hedef: Number(okunan.hedef) || null,
          tolerans: okunan.tolerans == null ? 4 : Number(okunan.tolerans),
          hizliEsik: okunan.hizliEsik == null ? 135 : Number(okunan.hizliEsik),
          hizliHedef: okunan.hizliHedef == null ? 145 : Number(okunan.hizliHedef),
          inisTolerans: okunan.inisTolerans == null ? INIS_PAYI_VARSAYILAN : Number(okunan.inisTolerans)
        };
      }
    } catch (e) { /* gizli pencere ya da bozuk kayıt: varsayılanla devam */ }
    H.hizAyari(ayar);
    return ayar;
  }

  function ayarKaydet(ayar) {
    H.hizAyari(ayar);
    try {
      localStorage.setItem(AYAR_ANAHTARI, JSON.stringify({
        hedef: ayar.hedef, tolerans: ayar.tolerans,
        hizliEsik: ayar.hizliEsik, hizliHedef: ayar.hizliHedef,
        inisTolerans: ayar.inisTolerans
      }));
    } catch (e) { /* saklanamazsa da ayar bu oturumda geçerli */ }
  }

  const BOLUM_ETIKETI = { giris: 'AÇILIŞ', ana: 'SABİT HIZ', hizli: 'HIZLI BÖLÜM' };

  // Ayarlıyken hangi parça hangi bölüme düşüyor? Ekranda tek satırda gösterilir.
  function bolumOzeti() {
    const ayar = H.hizAyari();
    if (!ayar.hedef) return '<p style="opacity:.6;font-size:13px">Hedef hız kapalı: sıralama yalnız 5 BPM kuralına bakar.</p>';
    const say = { giris: [], ana: [], hizli: [] };
    set.forEach(t => {
      const ad = H.hizBolumu(t);
      (say[ad] || []).push(t);
    });
    const hizliSabit = set.filter(t => H.hizliSabit(Number(t.bpm) || 0));
    // Hızlı bölümdekiler yukarıda ayrıca yazıldığı için burada tekrarlanmaz.
    const sabit = set.filter(t => H.sabitlenen(t) && !H.hizliSabit(Number(t.bpm) || 0));
    const hedefMetni = t => `${t.bpm} → ${H.etkinBpm(t)}`;
    const liste = (dizi, adet) => dizi.slice(0, adet).map(t => `${safe(t.title)} (${hedefMetni(t)})`).join(', ')
      + (dizi.length > adet ? ' …' : '');
    return `<p>Ana bölüm hedefi: <b>${ayar.hedef} BPM</b> ± ${ayar.tolerans} BPM.
        İniş payı <b>${ayar.inisTolerans} BPM</b> (zirveden en fazla bu kadar aşağı).
        ${hizliSabit.length ? `<b>${hizliSabit.length} parça ${ayar.hizliEsik} BPM üstü olduğu için
          hızlı bölümde ${ayar.hizliHedef} BPM'e sabitleniyor:</b>
          ${liste(hizliSabit, 6)}.` : `${ayar.hizliEsik} BPM üstünde parça yok.`}</p>
      ${sabit.length ? `<p>Hedefe çekilen ${sabit.length} parça: ${liste(sabit, 6)}.</p>`
        : '<p style="opacity:.6">Bu aralıkta parça yok.</p>'}
      ${say.hizli.length ? `<p>Hızlı bölüm (setin sonuna): <b>${say.hizli.map(t => safe(t.title) + ' (' + hedefMetni(t) + ')').join(', ')}</b>.</p>`
        : '<p style="opacity:.6">Hızlı bölüm boş.</p>'}
      ${say.giris.length ? `<p>Açılış (setin başına): <b>${say.giris.map(t => safe(t.title) + ' (' + t.bpm + ')').join(', ')}</b>.</p>` : ''}`;
  }

  function hizAyariHtml() {
    const ayar = H.hizAyari();
    return `<section class="hm-panel" style="margin-top:20px">
      <h2>HEDEF HIZ — BÖLÜMLÜ SET</h2>
      <p style="font-size:12px;opacity:.65;margin:0 0 12px">
        Sıralamada öncelik hızdır: set her zaman <b>yavaştan hızlıya</b> akar, ton
        uyumu bu iskeletin içinde aranır.<br>
        Ana bölümü tek hıza sabitliyorsan (ör. 122 civarı parçaları 126'da çalıyorsan)
        bu aralıktaki parçalar <b>aynı hızda</b> sayılır — aralarında hız farkı kalmaz.
        Hedefin üstünde kalanlar <b>setin sonundaki hızlı bölüme</b>, altında kalanlar açılışa ayrılır.
        Hızlı bölüm de tek hıza çekilir: <b>eşiğin üstündeki parçalar hızlı hedefte</b> çalınır
        (ör. 135 üstü → 145).<br>
        <b>İniş payı</b>, setin zirvesinden en fazla ne kadar aşağı inebileceğidir:
        2 BPM'lik tek bir dalma serbest, arka arkaya gelen inişler cezalı. 0 yazarsan
        set kıl payı geri dönmez.</p>
      <div class="hm-edit" style="border:0;padding-top:0;margin-top:0">
        <input id="hz-hedef" type="number" value="${ayar.hedef || ''}" placeholder="Ana hedef BPM (126)">
        <input id="hz-tol" type="number" value="${ayar.tolerans}" placeholder="± BPM">
        <input id="hz-esik" type="number" value="${ayar.hizliEsik}" placeholder="Hızlı eşik BPM (135)">
        <input id="hz-hizli" type="number" value="${ayar.hizliHedef || ''}" placeholder="Hızlı hedef BPM (145)">
        <input id="hz-inis" type="number" value="${ayar.inisTolerans}" placeholder="İniş payı BPM (2)">
        <button id="hz-uygula">UYGULA</button>
        <button id="hz-kapat" style="background:rgba(255,255,255,.08);color:inherit;border:1px solid rgba(255,255,255,.2)">KAPAT</button>
      </div>
      <div style="margin-top:12px">${bolumOzeti()}</div>
    </section>`;
  }

  const disLinkler = (sorgu, etiket) => {
    const l = H.aramaLinkleri(sorgu);
    return `<span class="hm-links"><span class="hm-chip">${safe(sorgu)}</span>
      <a class="hm-link" href="${safe(l.youtube)}" target="_blank" rel="noopener">${safe(etiket || 'YouTube\'da ara')} ↗</a>
      <a class="hm-link" href="${safe(l.spotify)}" target="_blank" rel="noopener">Spotify\'da ara ↗</a></span>`;
  };

  // Tarz önerileri paneli: solda kendi kataloğundan tarz imzası, sağda Deezer
  // algoritmasından benzer sanatçılar. Her ikisi de parçanın tarzını taşır.
  function tarzPanel() {
    // Referans: kullanıcı katalogdan bir parça seçtiyse o, yoksa setin sonuncusu.
    // Böylece "en son çalan neyse ona göre" varsayılanı bozulmaz, isteyen başka
    // bir sanatçıyı da analiz ettirebilir.
    const ref = selected || (set.length ? set[set.length - 1] : null);
    if (!ref) return '<p style="opacity:.5;font-size:13px">Önce bir parça seç ya da set kur.</p>';
    const refNotu = (selected && (!set.length || set[set.length - 1].id !== selected.id)) ? 'seçili parça' : 'setin sonuncusu';
    const tarz = H.tarzEtiketi(ref);
    const hedef = tarzHedefi(ref);

    // Katalogdan uyan sanatçılar: dış servise çıkmadan, elimizdeki parçalarla.
    const katalogUyan = set.length ? H.uyumluSanatcilar(set, tracks, 4) : [];
    const katalogHtml = katalogUyan.length ? katalogUyan.map(x => `
      <div class="hm-track" style="cursor:default;align-items:flex-start">
        <span><strong>${safe(x.sanatci)}</strong>
          <small>${safe(x.tarz)} · ${x.bpm ? x.bpm + ' BPM' : 'hız yok'} · katalogda ${x.parcalar.length} parça uyar</small>
          <span class="hm-rel">${x.parcalar.slice(0, 3).map(t => `<span class="hm-chip">${safe(t.title)}${t.camelot ? ' · ' + safe(t.camelot) : ''}${t.bpm ? ' · ' + safe(String(t.bpm)) : ''}</span>`).join('')}</span>
          <span style="display:block;margin-top:7px">${disLinkler(H.oneriSorgusu({
            sanatci: x.sanatci, tarz: x.tarz, tonlar: hedef.tonlar, bpmMin: hedef.bpmMin, bpmMax: hedef.bpmMax
          }))}</span>
        </span>
      </div>`).join('')
      : '<p style="opacity:.6;font-size:13px">Katalogdaki başka sanatçılarda sete uyan parça yok.</p>';

    // Dış öneri: referans sanatçının benzerleri (Deezer). Tek sefer sorulur.
    const sanatci = String(ref.artist || '').trim();
    if (sanatci && tarzDurum.sanatci !== sanatci && !tarzDurum.yukleniyor) {
      tarzDurum = { sanatci, veri: null, hata: null, yukleniyor: true };
      // Yanıt gelince panel tazelenir. Kullanıcı o sırada form dolduruyorsa
      // çizim atlanır: alanlara yazdığı yazı silinmesin, bir sonraki
      // etkileşimde (ya da YENİLE ile) öneriler zaten görünür.
      const tazele = () => {
        const odak = document.activeElement;
        if (odak && odak.tagName === 'INPUT' && byId('hm-app') && byId('hm-app').contains(odak)) return;
        render();
      };
      tarzGetir(sanatci).then(veri => {
        tarzDurum = { sanatci, veri, hata: null, yukleniyor: false };
        tazele();
      }).catch(hata => {
        tarzDurum = { sanatci, veri: null, hata: String((hata && hata.message) || hata), yukleniyor: false };
        tazele();
      });
    }

    let disHtml;
    if (!sanatci) {
      disHtml = '<p style="opacity:.6;font-size:13px">Referans parçanın sanatçısı girilmemiş; tarz önerisi için sanatçı alanını doldur.</p>';
    } else if (tarzDurum.yukleniyor || tarzDurum.sanatci !== sanatci) {
      disHtml = '<p style="opacity:.6;font-size:13px">Benzeri sanatçılar aranıyor…</p>';
    } else if (tarzDurum.hata) {
      disHtml = `<p class="hm-warn">“${safe(sanatci)}” için dış öneri alınamadı (${safe(tarzDurum.hata)}).
        Yukarıdaki arama bağlantılarıyla devam edebilirsin.</p>`;
    } else {
      const liste = (tarzDurum.veri && tarzDurum.veri.benzer) || [];
      disHtml = liste.length ? liste.map(a => {
        const parca = (a.parcalar || [])[0];
        const sorgu = H.oneriSorgusu({ sanatci: a.name, tarz, tonlar: [], bpmMin: null, bpmMax: null }).replace(' mix', '');
        const l = H.aramaLinkleri(sorgu);
        return `<div class="hm-track" style="cursor:default;align-items:flex-start">
          <span><strong>${safe(a.name)}</strong>
            <small>${parca ? safe(parca.title) : 'Deezer önerisi'} · ${safe(tarz)}
              ${parca && parca.preview ? `<button data-onizleme="${safe(parca.preview)}" style="padding:2px 8px;border-radius:8px;font-size:10px;border:1px solid rgba(224,195,65,.5);background:rgba(224,195,65,.14);color:#e8d15a;cursor:pointer">▶ 30 sn</button>` : ''}</small>
            <span style="display:block;margin-top:7px"><span class="hm-links">
              <a class="hm-link" href="${safe(l.youtube)}" target="_blank" rel="noopener">Tarzında YouTube ↗</a>
              <a class="hm-link" href="${safe(l.spotify)}" target="_blank" rel="noopener">Spotify ↗</a>
              <a class="hm-link" href="${safe(a.link)}" target="_blank" rel="noopener">Deezer ↗</a></span></span>
          </span>
        </div>`;
      }).join('')
        : '<p style="opacity:.6;font-size:13px">Deezer bu sanatçı için benzer sanatçı döndürmedi.</p>';
    }

    return `<p>Referans (${safe(refNotu)}): <b>${safe(ref.title)}</b> · ${safe(ref.artist || 'sanatçı yok')} ·
        <b>${safe(tarz)}</b>${ref.bpm ? ' · ' + safe(String(ref.bpm)) + ' BPM' : ''}
        <span style="opacity:.6">— başka bir sanatçıyı görmek için katalogdan parça seç.</span></p>
      <p>Sıradaki parça hedefi: <b>${safe(hedef.tonlar.join(' · ') || 'ton bilgisi yok')}</b> tonunda,
        <b>${safe(hedef.bpmMin ? hedef.bpmMin + '–' + hedef.bpmMax + ' BPM' : 'hız bilgisi yok')}</b>
        — yay yükseldiği için bir adım yukarısı.</p>
      ${disLinkler(H.oneriSorgusu({ sanatci: ref.artist || '', tarz, tonlar: hedef.tonlar, bpmMin: hedef.bpmMin, bpmMax: hedef.bpmMax }))}
      <h2 style="margin:16px 0 10px">KENDİ KATALOĞUNDAN UYAN SANATÇILAR</h2>
      ${katalogHtml}
      <h2 style="margin:16px 0 10px">BENZERİ SANATÇILAR — DEEZER ALGORİTMASI
        <button id="tarz-yenile" style="float:right;padding:4px 10px;border-radius:9px;font-size:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;cursor:pointer">YENİLE</button></h2>
      ${disHtml}`;
  }

  // Geçiş uymadığında araya girecek parçanın tonu ve hızı. Hız farkı tek
  // köprüyle kapanmıyorsa iki adım ayrı ayrı yazılır.
  function kopruHtml(g) {
    const k = H.kopru(g.onceki, g.sonraki);
    // Başlık sorunun ton mu hız mı yay mı olduğunu söyler: ton tutup hız
    // uzaksa köprü, set geriye dönüyorsa sıra değişikliği gerekir.
    const baslik = g.inis ? 'SIRA GERİYE DÖNÜYOR — HIZ DÜŞÜYOR'
      : ((g.iliski && !g.yanYana) ? 'ARAYA KÖPRÜ — TON UYUMLU, HIZ UZAK' : 'KÖPRÜ PARÇASI GEREKİYOR');
    const yerlestir = `<b>${safe(tonMetni(k))}</b> tonunda, <b>${safe(hizMetni(k))}</b> aralığında bir parça koy.`;
    const hedef = !k.tekParca ? 'tek parça yetmiyor; aşağıdaki iki köprüyü sırayla kullan.'
      : (g.inis ? `bu ikilinin sırasını değiştir; olmuyorsa araya ${yerlestir}` : `arasına ${yerlestir}`);
    // İniş varsa cümle "arasına" ile kurulmaz: önce sıra düzeltilir.
    const cumle = g.inis
      ? `“${safe(g.onceki.title)}” ile “${safe(g.sonraki.title)}” arasında hız düşüyor: ${hedef}`
      : `“${safe(g.onceki.title)}” ile “${safe(g.sonraki.title)}” ${hedef}`;
    const iki = k.ikiAdim ? `
      <p><b>1. köprü:</b> <b>${safe(tonMetni(k.ikiAdim.birinci))}</b> tonunda,
        <b>${safe(hizMetni(k.ikiAdim.birinci))}</b> — önceki parçanın hızına yakın.<br>
        <b>2. köprü:</b> <b>${safe(tonMetni(k.ikiAdim.ikinci))}</b> tonunda,
        <b>${safe(hizMetni(k.ikiAdim.ikinci))}</b> — sonraki parçanın hızına yakın.</p>
      ${k.ikiAdim.ornek.length ? `<p>İki köprü birbirine de bağlanmalı; örnek zincir:
        <b>${safe(k.ikiAdim.ornek.map(o => o.birinci + ' → ' + o.ikinci).join('  ·  '))}</b></p>` : ''}
      ${linkHtml({ tonlar: k.ikiAdim.birinci.tonlar, bpmMin: k.ikiAdim.birinci.bpmMin, bpmMax: k.ikiAdim.birinci.bpmMax })}
      ${linkHtml({ tonlar: k.ikiAdim.ikinci.tonlar, bpmMin: k.ikiAdim.ikinci.bpmMin, bpmMax: k.ikiAdim.ikinci.bpmMax })}` : '';
    // Tarzı korumak için ayrı bir arama: köprü parçası da aynı tarzda olmalı.
    const tarzSatiri = g.onceki && g.onceki.artist
      ? `<p style="opacity:.85">Tarzı koru (${safe(g.onceki.artist)}): ${disLinkler(H.oneriSorgusu({
          sanatci: g.onceki.artist, tarz: H.tarzEtiketi(g.onceki), tonlar: k.tonlar, bpmMin: k.bpmMin, bpmMax: k.bpmMax
        }))}</p>` : '';
    return `<div class="hm-kopru">
      <b>${baslik}</b>
      <p>${cumle}
        ${g.sorunlar.length ? 'Sorun: ' + safe(g.sorunlar.join(', ')) + '.' : ''}</p>
      ${iki}
      ${k.not ? `<p class="hm-warn">${safe(k.not)}</p>` : ''}
      ${tarzSatiri}
      ${k.tekParca ? linkHtml({ tonlar: k.tonlar, bpmMin: k.bpmMin, bpmMax: k.bpmMax }) : ''}
    </div>`;
  }

  // Setin tamamına bakış. Yerel geçiş listesi yayı göstermez: tek tek
  // bakıldığında 122 → 124 ile 124 → 122 eşit derecede yakın görünür, oysa set
  // yavaştan hızlıya akmalı. Burada eğri, zirvenin yeri ve en büyük atlama yazılır.
  function yayHtml() {
    if (set.length < 2) return '<p style="opacity:.5;font-size:13px">Yay için en az iki parça gerekir.</p>';
    const y = H.yay(set);
    const hedefHiz = H.hizAyari().hedef;
    const satirlar = [`<p>Yay: <b>${safe(String(y.ilk))} → ${safe(String(y.son))} BPM</b>${hedefHiz ? ` (sabitlenen hızlar; ham ${y.ilkHam} → ${y.sonHam})` : ''} ·
      ${y.yukselen ? '<b>yükseliyor</b>' : 'zikzaklı'}.
      En hızlı parça <b>${safe(y.zirve.title)}</b> (${safe(String(y.zirve.bpm))} BPM),
      ${y.zirveYeri + 1}. sırada.</p>`];

    // Zirve sonda değilse setin ikinci yarısı yavaşlıyor demektir.
    if (y.zirveSonrasi > Math.floor(set.length * 0.2)) {
      satirlar.push(`<p class="hm-warn">Zirve erken: en hızlı parçadan sonra ${y.zirveSonrasi} parça
        daha geliyor. Setin en hızlı parçası sona yakın olmalı.</p>`);
    }

    // Geriye düşen adımlar: köprü değil, sıra değişikliği ister. Ölçü zirveden
    // sapmadır; küçük adımlarla oluşan uzun inişler de böylece yakalanır.
    y.inisler.forEach(g => satirlar.push(`<p class="hm-warn">“${safe(g.onceki.title)}” →
      “${safe(g.sonraki.title)}”: hız zirveden <b>${g.dusus} BPM</b> aşağı iniyor. Bu ikilinin
      sırasını değiştir ya da araya daha yavaş bir parça koy.</p>`));

    // En büyük çıkış: araya ısınma parçası koymak için hedef hız.
    let atlama = null;
    set.slice(1).forEach((t, i) => {
      const onceki = set[i];
      const artis = (Number(t.bpm) || 0) - (Number(onceki.bpm) || 0);
      if (artis > 10 && (!atlama || artis > atlama.artis)) atlama = { artis, onceki, sonraki: t };
    });
    if (atlama) {
      const orta = Math.round(((Number(atlama.onceki.bpm) || 0) + (Number(atlama.sonraki.bpm) || 0)) / 2);
      satirlar.push(`<p>En büyük çıkış: “${safe(atlama.onceki.title)}” → “${safe(atlama.sonraki.title)}”
        arasında <b>${atlama.artis} BPM</b> atlama var; araya <b>${orta} BPM</b> civarı bir
        ısınma parçası yayı düzler.</p>`);
    }

    if (satirlar.length === 1) {
      satirlar.push('<p style="opacity:.65">Set baştan sona yükseliyor; tek tek hız düşüşü yok.</p>');
    }
    return satirlar.join('');
  }

  // Uymayan parçalar: setin içinde kopukluk yaratanlar ve sete hiç giremeyenler.
  function uyumsuzPanel() {
    if (!set.length) return '<p style="opacity:.5;font-size:13px">Set boş: önce parça ekle.</p>';
    const icinde = H.uymayanlar(set);
    const disi = H.setDisiKalanlar(set, tracks);
    const tonlar = H.uyumluTonlar(set, 3).map(x => x.ton);
    // Yerine aranacak parçanın hızı, bu tonlara uyan setteki parçaların hızına
    // göre verilir: setin tamamının 96–131 gibi geniş aralığı işe yaramaz, çünkü
    // parça yalnızca tonu uyan komşusuna 5 BPM içinde bağlanabilir.
    const eslesen = set.filter(t => tonlar.some(ton =>
      H.relation(t.camelot, ton) || H.relation(ton, t.camelot)));
    const eslesenBpm = eslesen.map(t => Number(t.bpm)).filter(Boolean);
    // Yeni parça komşusuna 5 BPM içinde bağlanmalı: uygun hızlar, tonu uyan
    // komşuların ±5 BPM pencerelerinin birleşimidir. Tek bir min–max aralığı
    // yanıltır (91 ile 136 arası sanılır), ortada boşluk varsa ayrı yazılır.
    const pencereler = eslesenBpm.map(b => [b - H.HIZ_TOLERANS, b + H.HIZ_TOLERANS])
      .sort((u, v) => u[0] - v[0]);
    const araliklar = [];
    pencereler.forEach(pencere => {
      const son = araliklar[araliklar.length - 1];
      if (son && pencere[0] <= son[1] + 1) son[1] = Math.max(son[1], pencere[1]);
      else araliklar.push(pencere.slice());
    });
    const enGenis = araliklar.slice().sort((u, v) => (v[1] - v[0]) - (u[1] - u[0]))[0];
    const setHedef = {
      tonlar,
      bpmMin: enGenis ? enGenis[0] : null,
      bpmMax: enGenis ? enGenis[1] : null
    };
    const aralikMetni = araliklar.length
      ? araliklar.slice(0, 3).map(a => a[0] + '–' + a[1] + ' BPM').join(' ya da ')
      : 'hız bilgisi yok';

    if (!icinde.length && !disi.length) {
      return '<p style="opacity:.6;font-size:13px">Bütün geçişler uyumlu; değiştirilecek parça yok.</p>';
    }

    const icindeHtml = icinde.map(x => {
      const i = x.sira;
      const onceki = set[i - 1], sonraki = set[i + 1];
      const hedef = (onceki && sonraki)
        ? H.kopru(onceki, sonraki)
        : H.kopru(onceki || sonraki, onceki || sonraki);
      return `<div class="hm-kopru">
        <b>${safe(x.parca.title)} — SET İÇİNDE UYMUYOR</b>
        <p>${safe(x.sebep)}. Yerine ${hedef.tekParca
          ? `<b>${safe(tonMetni(hedef))}</b> tonunda, <b>${safe(hizMetni(hedef))}</b> aralığında bir parça koy.`
          : 'komşularına uyan <b>tek</b> parça yetmiyor; köprü zinciri ya da parçayı kaydırmak gerekir.'}</p>
        ${hedef.ikiAdim ? `<p>1. köprü: <b>${safe(tonMetni(hedef.ikiAdim.birinci))}</b> tonunda,
          <b>${safe(hizMetni(hedef.ikiAdim.birinci))}</b> · 2. köprü:
          <b>${safe(tonMetni(hedef.ikiAdim.ikinci))}</b> tonunda,
          <b>${safe(hizMetni(hedef.ikiAdim.ikinci))}</b></p>` : ''}
        ${hedef.not ? `<p class="hm-warn">${safe(hedef.not)}</p>` : ''}
        ${linkHtml({ tonlar: hedef.tonlar, bpmMin: hedef.bpmMin, bpmMax: hedef.bpmMax })}
      </div>`;
    }).join('');

    const disiHtml = disi.length ? `<div class="hm-kopru">
      <b>SETE GİRMEYEN ${disi.length} KATALOG PARÇASI</b>
      <p>${disi.slice(0, 8).map(t => safe(t.title)).join(', ')}${disi.length > 8 ? ' …' : ''}
        — setteki tonlarla bağlanmıyor.</p>
      <p>Yerlerine setteki tonlara uyan bir parça ara: <b>${safe(tonlar.join(' · ') || 'ton bilgisi yok')}</b>,
        <b>${safe(aralikMetni)}</b> (komşusuna 5 BPM içinde bağlanmalı).</p>
      ${linkHtml(setHedef)}
    </div>` : '';

    return icindeHtml + disiHtml;
  }
