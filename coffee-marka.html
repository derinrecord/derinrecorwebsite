<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marka Sunumu — Derin Record</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="stylesheet" href="/branch.css">
<link rel="stylesheet" href="/auth.css">
<link rel="stylesheet" href="/glass.css?v=3">
<link rel="stylesheet" href="/marka-sunum.css?v=19">
</head>
<body>
<div class="noise"></div>
<header class="header mk-top">
  <a class="home" href="/coffee"><span>←</span> KURUMSAL</a>
  <div class="wordmark">DERİN<br>RECORD<b>•</b></div>
</header>
<main class="admin-main mk-root" id="mk-root">
  <div id="mk-lock" class="mk-lock">
    <p class="mk-eyebrow">ÖZEL SUNUM</p>
    <h2>Bu sunum markaya özeldir.</h2>
    <p>Size iletilen erişim kodunu girin. Kod yalnızca bu oturum boyunca hatırlanır.</p>
    <div class="mk-code">
      <input id="mk-kod" placeholder="ERİŞİM KODU" autocomplete="off" spellcheck="false">
      <button id="mk-gir" type="button">SUNUMU AÇ</button>
    </div>
    <p class="mk-err" id="mk-hata"></p>
    <p class="mk-hint">Kodunuz yoksa Derin Record ile iletişime geçin.</p>
  </div>
  <div id="mk-app" hidden></div>
</main>
<audio id="mk-audio" preload="auto"></audio>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1"></script>
<script src="/r2-depo.js?v=1"></script>
<script src="/coffee-marka.js?v=22"></script>
</body>
</html>
