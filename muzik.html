<!doctype html>
<html lang="tr" data-dil-otomatik data-baslik-en="Music — Derin Record">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Müzik — Derin Record</title>
  <meta name="description" content="Derin Record müzik kataloğu: şarkıları dinle, alternatif versiyonları ve stemleri incele, kullanımına uygun lisansı al." data-en="Derin Record music catalog: listen to tracks, explore alternates and stems, and license them for your project.">
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="mobil.css?v=5" />
  <link rel="stylesheet" href="auth.css?v=20261101a">
  <link rel="stylesheet" href="dil.css?v=2026102401">
  <link rel="stylesheet" href="ses-efektleri.css?v=2">
  <link rel="stylesheet" href="muzik.css?v=2">
<link rel="stylesheet" href="ortak-ust.css?v=3">
</head>
<body class="se-sayfa">
  <header class="header"></header><script src="ortak-ust.js?v=3"></script>
  <div class="se-duzen">
    <aside class="se-yan" aria-label="Filtreler">
      <h2>Filtrele</h2>
      <div id="mk-filtreler"></div>
    </aside>
    <main class="se-ana">
      <div class="se-arama-satir">
        <label class="se-arama">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="se-gizli">Şarkı, sanatçı ya da etiket ara</span>
          <input type="search" id="mk-ara" placeholder="Şarkı, sanatçı ya da etiket ara" autocomplete="off">
        </label>
        <label><span class="se-gizli">Sırala</span>
          <select class="se-secim" id="mk-sirala">
            <option value="yeni">Yeni eklenen</option>
            <option value="ad">Ada göre</option>
            <option value="kisa">Süre: kısadan uzuna</option>
            <option value="bpm">BPM: yavaştan hızlıya</option>
          </select>
        </label>
      </div>
      <p class="se-durum" id="mk-durum" role="status" aria-live="polite"></p>
      <section>
        <h1 style="margin:0">Öne çıkan şarkılar</h1>
        <p class="se-aciklama">Dinle, alternatif versiyonları ve stemleri incele. Sepet simgesinden kullanımına uygun lisansı seç.</p>
        <div class="se-liste" id="mk-liste"><p class="se-bos">Yükleniyor…</p></div>
      </section>
      <section class="se-kutu" id="lisanslarim" hidden>
        <h2 class="se-bolum" style="margin:0">Lisanslarım</h2>
        <p class="se-aciklama" style="margin:0">Havaleyi yapıp dekontu yükle. Ödeme onaylanınca ana kayıt, alternatif versiyonlar ve stemler burada indirilebilir.</p>
        <div id="mk-lisanslar"></div>
      </section>
    </main>
  </div>
  <div id="mk-panel-kok"></div>
  <script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1"></script><script src="uygulama.js?v=1"></script><script src="auth.js?v=20261119b"></script>
  <script src="r2-depo.js?v=5"></script><script src="satin-alma.js?v=17"></script><script src="muzik.js?v=2"></script>
  <script src="dil.js?v=2026110101" defer></script>
</body>
</html>
